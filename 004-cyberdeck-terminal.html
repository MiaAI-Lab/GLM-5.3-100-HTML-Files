<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBERDECK // NIGHT CITY</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#050607; color:#33ff66; overflow:hidden;
    font-family:"Courier New", Courier, monospace;
    display:flex; flex-direction:column;
  }
  #crt {
    position:fixed; inset:0; display:flex; flex-direction:column;
    background:
      radial-gradient(ellipse at center, rgba(10,22,12,.42), rgba(2,4,3,.88) 88%),
      #050607;
  }
  /* scanlines + flicker */
  #crt::before {
    content:""; position:absolute; inset:0; pointer-events:none; z-index:40;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  }
  #crt::after {
    content:""; position:absolute; inset:0; pointer-events:none; z-index:41;
    background:linear-gradient(180deg, rgba(51,255,102,.05), transparent 12%, transparent 88%, rgba(51,255,102,.05));
    animation:flick 4.2s infinite steps(1);
  }
  @keyframes flick {
    0%,93% { opacity:1; } 94% { opacity:.72; } 95% { opacity:1; }
    96.5% { opacity:.85; } 97% { opacity:1; } 100% { opacity:1; }
  }
  /* top HUD */
  .hud {
    display:flex; gap:14px; align-items:center; padding:8px 14px;
    border-bottom:1px solid #1d3a24; font-size:11px; letter-spacing:.14em;
    color:#2b8f4b; text-transform:uppercase; flex-wrap:wrap;
    text-shadow:0 0 6px rgba(51,255,102,.55); z-index:10;
  }
  .hud .sep { color:#1d5c33; }
  #clock { margin-left:auto; }
  .bars { display:flex; gap:2px; align-items:flex-end; height:14px; }
  .bars i { width:3px; background:#2f6; animation:bar 1.1s infinite ease-in-out alternate; box-shadow:0 0 4px #2f6; }
  .bars i:nth-child(1){height:30%; animation-delay:0s} .bars i:nth-child(2){height:55%; animation-delay:.15s}
  .bars i:nth-child(3){height:80%; animation-delay:.3s} .bars i:nth-child(4){height:100%; animation-delay:.45s}
  .bars i:nth-child(5){height:65%; animation-delay:.6s}
  @keyframes bar { to { transform:scaleY(.35); } }
  /* ICE meter */
  .ice { display:flex; align-items:center; gap:6px; }
  .ice .cells { display:flex; gap:2px; }
  .ice .cells i { width:9px; height:9px; border:1px solid #2b8f4b; }
  .ice .cells i.on { background:#33ff66; box-shadow:0 0 6px #33ff66; }
  /* main split */
  .main { flex:1; display:flex; min-height:0; }
  .termwrap { flex:1; display:flex; flex-direction:column; min-width:0; padding:12px 14px; }
  #screen {
    flex:1; overflow-y:auto; font-size:14px; line-height:1.5; padding-right:6px;
    text-shadow:0 0 7px rgba(51,255,102,.6); scrollbar-width:thin; scrollbar-color:#1d5c33 #050607;
  }
  #screen::-webkit-scrollbar { width:6px; } #screen::-webkit-scrollbar-thumb { background:#1d5c33; }
  .line { white-space:pre-wrap; word-break:break-word; }
  .dim { color:#2b8f4b; } .hot { color:#aaffcc; text-shadow:0 0 10px #33ff66; }
  .warn { color:#ffd23e; text-shadow:0 0 8px rgba(255,210,62,.7); }
  .bad { color:#ff5555; text-shadow:0 0 8px rgba(255,85,85,.7); }
  .sys { color:#33ccff; text-shadow:0 0 8px rgba(51,204,255,.6); }
  .inputline { display:flex; align-items:baseline; gap:8px; }
  .inputline .ps { color:#aaffcc; white-space:nowrap; }
  #cmd {
    flex:1; background:transparent; border:none; outline:none; color:#c8ffd8;
    font:inherit; caret-color:transparent; text-shadow:0 0 7px rgba(51,255,102,.6);
  }
  .cursor {
    display:inline-block; width:9px; height:17px; background:#33ff66; vertical-align:text-bottom;
    animation:blink 1.05s steps(1) infinite; box-shadow:0 0 8px #33ff66;
  }
  @keyframes blink { 50% { opacity:0; } }
  /* side panel */
  .side {
    width:230px; border-left:1px solid #1d3a24; padding:12px; display:flex; flex-direction:column; gap:12px;
    font-size:11px; color:#2b8f4b;
  }
  .panel h4 { font-size:10px; letter-spacing:.22em; color:#2b8f4b; margin-bottom:6px; text-transform:uppercase; }
  #wave { width:100%; height:64px; background:#030a05; border:1px solid #1d3a24; }
  .kv { display:flex; justify-content:space-between; letter-spacing:.08em; }
  .kv b { color:#aaffcc; font-weight:normal; }
  .icebar { height:10px; border:1px solid #2b8f4b; position:relative; }
  .icebar i { position:absolute; inset:1px auto 1px 1px; width:40%; background:linear-gradient(90deg,#1d5c33,#33ff66); transition:width .6s; }
  .quick { display:flex; flex-wrap:wrap; gap:6px; }
  .quick button {
    background:transparent; border:1px solid #2b8f4b; color:#33ff66; font:inherit; font-size:10px;
    padding:4px 8px; cursor:pointer; letter-spacing:.1em; text-transform:uppercase; transition:all .15s;
  }
  .quick button:hover { background:#124; background:rgba(51,255,102,.14); box-shadow:0 0 10px rgba(51,255,102,.35); }
  .alert {
    position:fixed; inset:0; z-index:60; pointer-events:none; opacity:0; transition:opacity .2s;
    box-shadow:inset 0 0 120px 30px rgba(255,45,45,.35);
  }
  .alert.on { opacity:1; animation:alrt .5s infinite alternate; }
  @keyframes alrt { to { box-shadow:inset 0 0 160px 50px rgba(255,45,45,.5); } }
  .statusbar {
    display:flex; gap:16px; padding:6px 14px; border-top:1px solid #1d3a24; font-size:10px;
    letter-spacing:.18em; color:#2b8f4b; text-transform:uppercase; z-index:10;
  }
  .statusbar .okdot { width:7px; height:7px; border-radius:50%; background:#33ff66; box-shadow:0 0 6px #33ff66; display:inline-block; margin-right:5px; animation:blink 2s infinite; }
  @media (max-width:760px) {
    .side { display:none; }
    #screen { font-size:13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #crt::after, .bars i, .alert.on, .statusbar .okdot { animation:none !important; }
    .cursor { animation:none; }
  }
</style>
</head>
<body>
<div id="crt">
  <div class="hud">
    <span>NIGHT&#8202;CITY GRID</span><span class="sep">//</span>
    <span>DECK MK.VII</span><span class="sep">//</span>
    <span class="ice">ICE <span class="cells" id="iceCells"><i></i><i></i><i></i><i></i><i></i><i></i></span></span>
    <span>SIGNAL <span class="bars"><i></i><i></i><i></i><i></i><i></i></span></span>
    <span id="clock">--:--:--</span>
  </div>
  <div class="main">
    <div class="termwrap">
      <div id="screen" aria-live="polite"></div>
      <div class="inputline" id="inputline" style="display:none">
        <span class="ps">runner@nightcity:~$</span>
        <input id="cmd" autocomplete="off" spellcheck="false" aria-label="terminal input">
        <span class="cursor" id="cur"></span>
      </div>
    </div>
    <div class="side">
      <div class="panel">
        <h4>Neural Waveform</h4>
        <canvas id="wave" width="204" height="64"></canvas>
      </div>
      <div class="panel">
        <h4>Deck Stats</h4>
        <div class="kv"><span>CPU</span><b id="stCpu">61°C</b></div>
        <div class="kv"><span>MEM</span><b id="stMem">38%</b></div>
        <div class="kv"><span>NET</span><b id="stNet">FORCED</b></div>
        <div class="kv"><span>EURO</span><b id="stEd">¤ 2,045</b></div>
      </div>
      <div class="panel">
        <h4>ICE Integrity</h4>
        <div class="icebar"><i id="iceBar"></i></div>
        <div class="kv" style="margin-top:5px"><span>TRACE</span><b id="stTrace">0%</b></div>
      </div>
      <div class="panel">
        <h4>Quick Exec</h4>
        <div class="quick">
          <button data-run="help">help</button>
          <button data-run="scan">scan</button>
          <button data-run="decrypt">decrypt</button>
          <button data-run="jack in">jack in</button>
          <button data-run="clear">clear</button>
        </div>
      </div>
    </div>
  </div>
  <div class="statusbar">
    <span><span class="okdot"></span>LINK STABLE</span>
    <span id="sbMode">MODE: PASSIVE</span>
    <span id="sbPos">SECTOR 7 · WATSON</span>
  </div>
</div>
<div class="alert" id="alert"></div>

<script>
(() => {
  "use strict";
  const screen = document.getElementById("screen");
  const inputline = document.getElementById("inputline");
  const cmd = document.getElementById("cmd");
  const sbMode = document.getElementById("sbMode");
  let jacked = false, busy = false;

  /* ---------- output helpers ---------- */
  function line(html, cls) {
    const d = document.createElement("div");
    d.className = "line" + (cls ? " " + cls : "");
    d.innerHTML = html;
    screen.appendChild(d);
    screen.scrollTop = screen.scrollHeight;
    return d;
  }
  async function type(text, cls, speed) {
    const d = line("", cls);
    for (let i = 0; i < text.length; i++) {
      d.textContent += text[i];
      screen.scrollTop = screen.scrollHeight;
      await sleep(speed || 14);
    }
    return d;
  }
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  /* ---------- boot sequence ---------- */
  const BOOT = [
    ["CYBERDECK MK.VII — BIOS 7.7.4", "hot", 24],
    ["mem check ............ 640K OK (lying)", "dim", 10],
    ["neural bus ........... HANDSHAKE OK", "dim", 10],
    ["loading daemons: [ice] [ghost] [sable] ... OK", "dim", 10],
    ["mounting /nightcity ... sectors 1-9 RO", "dim", 10],
    ["courier drop: 1 new message from 'rogue.mp3'", "sys", 26],
    ["", "", 0],
    ["WELCOME TO NIGHT CITY, CHOOM.", "hot", 30],
    ["type `help` — the deck does the rest.", "dim", 16],
  ];
  async function boot() {
    for (const [t, c, s] of BOOT) { await type(t, c, s); await sleep(60); }
    inputline.style.display = "flex";
    cmd.focus();
  }

  /* ---------- commands ---------- */
  const helpText = [
    ["AVAILABLE COMMANDS", "hot"],
    ["  help      this menu, obviously", "dim"],
    ["  scan      sweep the local netgrid", "dim"],
    ["  decrypt   brute a captured shard", "dim"],
    ["  jack in   sync neural link (do it)", "dim"],
    ["  clear     wipe the screen", "dim"],
  ];
  const sass = [
    "unknown command. even the AI here is disappointed.",
    "that's not a command. corpo spelling, maybe?",
    "404: talent not found. try `help`.",
    "the netgrid heard you and chose violence. try `help`.",
  ];

  async function runScan() {
    sbMode.textContent = "MODE: SCANNING";
    await type("sweeping netgrid on 7 channels ...", "dim", 10);
    const nets = [
      ["ARASAKA-TOWER-5", "-71dBm", "WPA3-ICE", "bad"],
      ["afterlife_guest", "-58dBm", "OPEN (bait?)", "warn"],
      ["netwatch-decoy-9", "-12dBm", "DEFINITELY A TRAP", "bad"],
      ["vistas-del-rey-mesh", "-44dBm", "WPA2", "hot"],
      ["[hidden] darknet node", "-66dBm", "???", "sys"],
    ];
    for (const [ssid, db, sec, c] of nets) {
      await sleep(220);
      line("  ▸ " + ssid.padEnd(22) + db.padEnd(9) + sec, c);
    }
    await type("5 nodes found. 2 would end your career.", "dim", 8);
    sbMode.textContent = "MODE: PASSIVE";
  }

  async function runDecrypt() {
    sbMode.textContent = "MODE: DECRYPTING";
    await type("captured shard: <b>blackwall_fragments.dat</b>", "dim", 8);
    const d = line("", "hot");
    for (let p = 0; p <= 100; p += 4) {
      const blocks = Math.round(p / 4);
      d.textContent = "  [" + "█".repeat(blocks) + "·".repeat(25 - blocks) + "] " + p + "%";
      screen.scrollTop = screen.scrollHeight;
      await sleep(70);
    }
    await type("decrypted: 'never dance with an AI by the router.' — v.", "sys", 12);
    sbMode.textContent = "MODE: PASSIVE";
  }

  async function runJackIn() {
    if (jacked) { line("already jacked in. greedy.", "warn"); return; }
    busy = true; sbMode.textContent = "MODE: SYNCING";
    await type("neural link handshake ...", "dim", 12);
    const flood = [
      "▚▞▚ SYNAPTIC MAPPING 61% ▚▞▚",
      "▞▚▞ CORTICAL CACHE WARM ▞▚▞",
      "▚▞▚ ICE NEGOTIATED (it blinked first) ▚▞▚",
    ];
    for (const f of flood) { line(f, "sys"); await sleep(260); }
    await sleep(400);
    line("■ ■ ■  N E U R A L   L I N K   E S T A B L I S H E D  ■ ■ ■", "hot");
    jacked = true; busy = false;
    sbMode.textContent = "MODE: JACKED";
    document.getElementById("stNet").textContent = "NEURAL";
    document.getElementById("iceBar").style.width = "88%";
    iceSet(5);
  }

  async function exec(raw) {
    const c = raw.trim().toLowerCase();
    line("<span class='hot'>runner@nightcity:~$</span> " + raw.replace(/</g, "&lt;"));
    if (!c) return;
    if (c === "help") { helpText.forEach(([t, cl]) => line(t, cl)); return; }
    if (c === "clear") { screen.innerHTML = ""; return; }
    if (c === "scan") return runScan();
    if (c === "decrypt") return runDecrypt();
    if (c === "jack in" || c === "jackin" || c === "jack-in") return runJackIn();
    if (c === "sudo" || c.startsWith("sudo")) { line("nice try. root belongs to the corps, choom.", "bad"); return; }
    line(sass[Math.floor(Math.random() * sass.length)], "warn");
  }

  /* ---------- input ---------- */
  cmd.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !busy) {
      const v = cmd.value; cmd.value = "";
      exec(v);
    }
  });
  document.querySelectorAll(".quick button").forEach(b =>
    b.addEventListener("click", () => { exec(b.dataset.run); cmd.focus(); })
  );
  document.getElementById("crt").addEventListener("click", () => cmd.focus());

  /* ---------- ambient systems ---------- */
  function iceSet(n) {
    document.querySelectorAll("#iceCells i").forEach((c, i) => c.classList.toggle("on", i < n));
  }
  iceSet(3);
  const clockEl = document.getElementById("clock");
  setInterval(() => {
    const d = new Date();
    clockEl.textContent = [d.getHours(), d.getMinutes(), d.getSeconds()]
      .map(x => String(x).padStart(2, "0")).join(":") + " NST";
  }, 1000);

  setInterval(() => {
    document.getElementById("stCpu").textContent = (57 + Math.random() * 14).toFixed(0) + "°C";
    document.getElementById("stMem").textContent = (34 + Math.random() * 12).toFixed(0) + "%";
    const tr = jacked ? Math.random() * 22 : Math.random() * 4;
    document.getElementById("stTrace").textContent = tr.toFixed(0) + "%";
  }, 2400);

  /* waveform canvas */
  const wc = document.getElementById("wave"), wctx = wc.getContext("2d");
  let wt = 0, boost = 0;
  function drawWave() {
    if (!document.hidden) {
      wt += 0.11 + boost * 0.25; boost = Math.max(0, boost - 0.004);
      wctx.clearRect(0, 0, wc.width, wc.height);
      wctx.strokeStyle = "#33ff66";
      wctx.shadowColor = "#33ff66"; wctx.shadowBlur = 8;
      wctx.lineWidth = 1.4;
      wctx.beginPath();
      for (let x = 0; x < wc.width; x++) {
        const a = (1 + boost * 3) * 9 * Math.sin(x * 0.07 + wt) * Math.sin(x * 0.013 + wt * 0.4);
        const y = wc.height / 2 + a;
        x ? wctx.lineTo(x, y) : wctx.moveTo(x, y);
      }
      wctx.stroke();
    }
    requestAnimationFrame(drawWave);
  }
  drawWave();
  setInterval(() => { boost = Math.min(1, boost + 0.3); }, 4200);

  /* ICE degradation drama */
  setInterval(() => {
    if (jacked && Math.random() < 0.25) {
      const alert = document.getElementById("alert");
      alert.classList.add("on");
      line("!! ICE probe deflected — countermeasures delicious !!", "bad");
      setTimeout(() => alert.classList.remove("on"), 1400);
    }
  }, 9000);

  boot();
})();
</script>
</body>
</html>
