<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISOPOP — a floating pastel city</title>
<style>
:root{
  --sky1:#BEE3F0; --sky2:#DFF3F1; --p0:#FDF1E3; --p1:#F9E2E7; --p2:#E4EEF7;
  --p3:#EFE7F6; --p4:#FDEECF; --p5:#E3F2E9; --p6:#F6E9E0;
  --ink:#5A4A57; --night:#231B33; --night2:#2E2450;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,#EAF5EA 100%);
  color:var(--ink); overflow:hidden; min-height:100vh;
  transition:background 1.6s ease;
}
body.night{
  background:linear-gradient(180deg,var(--night) 0%,var(--night2) 60%,#3A2E5C 100%);
}
/* ---------- header ---------- */
header{
  position:fixed; top:0; left:0; right:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px clamp(14px,3vw,28px); pointer-events:none;
}
.brand{display:flex; align-items:center; gap:10px}
.cube-mini{
  width:30px;height:30px; border-radius:7px; position:relative; flex:none;
  background:
    conic-gradient(from 235deg at 50% 38%,
      #F6A9BF 0 120deg,#E7A3C6 120deg 240deg,#D68FB8 240deg);
  box-shadow:0 3px 8px rgba(90,74,87,.28), inset 0 -4px 6px rgba(0,0,0,.08);
}
.cube-mini::after{
  content:""; position:absolute; inset:5px 5px 8px; border-radius:5px;
  background:#FFF7EE;
  clip-path:polygon(0 35%,50% 0,100% 35%,100% 100%,0 100%);
}
h1{font-size:clamp(17px,2.4vw,24px); letter-spacing:.14em; font-weight:800}
h1 em{font-style:normal; color:#D0679B}
.clock{
  font-family:"Courier New",monospace; font-size:clamp(11px,1.4vw,14px);
  background:rgba(255,255,255,.55); border:1px solid rgba(90,74,87,.18);
  padding:7px 12px; border-radius:99px; backdrop-filter:blur(6px);
  font-weight:700; letter-spacing:.08em;
}
body.night .clock{background:rgba(35,27,51,.55); border-color:rgba(255,255,255,.2); color:#EDE6FF}
/* ---------- HUD bottom ---------- */
.hud{
  position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom));
  transform:translateX(-50%); z-index:50;
  display:flex; align-items:center; gap:14px; padding:10px 16px;
  background:rgba(255,251,244,.8); border:1px solid rgba(90,74,87,.15);
  border-radius:16px; box-shadow:0 10px 30px rgba(60,40,70,.18);
  backdrop-filter:blur(10px); max-width:min(92vw,560px);
}
body.night .hud{background:rgba(30,24,48,.82); border-color:rgba(255,255,255,.16)}
.sun-switch{
  position:relative; width:64px; height:32px; border-radius:99px; border:none; cursor:pointer;
  background:linear-gradient(90deg,#FFD98E 0%,#FFC46B 50%,#7B6AA8 100%);
  transition:.5s; flex:none;
}
.sun-switch .knob{
  position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#FFFDF6,#FFE3A8 60%,#F5B75F);
  box-shadow:0 2px 6px rgba(120,80,20,.4); transition:.45s cubic-bezier(.6,-0.3,.3,1.4);
}
body.night .sun-switch .knob{left:35px; background:radial-gradient(circle at 34% 30%,#FFF8E7,#D8D4F0 58%,#9C97C9)}
.sun-switch::after{
  content:attr(data-label); position:absolute; left:50%; transform:translate(-50%,0);
  bottom:-17px; font-size:9px; font-weight:700; letter-spacing:.12em; opacity:.75;
}
.hud-readout{
  font-family:"Courier New",monospace; font-size:11px; font-weight:700;
  letter-spacing:.06em; line-height:1.5; opacity:.85; min-width:110px;
}
.hud-readout b{color:#D0679B}
.hint{font-size:10.5px; letter-spacing:.04em; opacity:.65; line-height:1.45; max-width:200px}
/* ---------- stage ---------- */
.stage{
  position:fixed; inset:0; display:grid; place-items:center;
  perspective:1100px; cursor:grab; touch-action:none; overflow:hidden;
}
.stage:active{cursor:grabbing}
.diorama{
  position:relative; width:min(88vw,660px); aspect-ratio:1/0.92;
  transform-style:preserve-3d;
}
.iso{transform:rotateX(58deg) rotateZ(-45deg); transform-style:preserve-3d}
/* floating drift */
@keyframes bob{0%,100%{transform:translateY(-7px)}50%{transform:translateY(7px)}}
.bob{animation:bob 7s ease-in-out infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}
/* ---------- island base ---------- */
.rock{
  position:absolute; left:50%; top:56%; width:66%; height:66%;
  transform:translate(-50%,-50%) translateZ(-40px);
  background:radial-gradient(ellipse at 40% 20%, #D8B7A0, #B98D77 55%, #8A604C);
  border-radius:50% 50% 46% 46% / 60% 60% 40% 40%;
  box-shadow:inset 0 -18px 30px rgba(66,40,32,.45);
  filter:drop-shadow(0 30px 40px rgba(50,60,90,.35));
}
.dirt{
  position:absolute; left:50%; top:56%; width:58%; height:58%;
  transform:translate(-50%,-50%) translateZ(-28px);
  background:radial-gradient(ellipse at 45% 25%, #A9825F, #8A6647);
  border-radius:50% 50% 44% 44% / 58% 58% 42% 42%;
}
.grass{
  position:absolute; left:50%; top:56%; width:56%; height:56%;
  transform:translate(-50%,-50%) translateZ(-16px);
  background:radial-gradient(ellipse at 42% 22%, #A9DBB0, #8CC98F 60%, #74B77D);
  border-radius:50% 60% 46% 54% / 56% 50% 50% 50%;
}
.grass::after{ /* sparkles */
  content:""; position:absolute; inset:-10%;
  background:
    radial-gradient(2px 2px at 20% 30%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 70% 60%, #fff, transparent),
    radial-gradient(2px 2px at 45% 80%, #fff, transparent);
  opacity:0; transition:opacity 1.2s;
}
body.night .grass::after{opacity:.5}
/* ---------- shadow blob under island ---------- */
.puddle{
  position:absolute; left:50%; top:84%; width:52%; height:16%;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse, rgba(40,55,90,.28), transparent 70%);
  border-radius:50%;
}
/* ---------- tiles / roads / structures get created in JS as absolutely positioned divs in world ---------- */
.world{
  position:absolute; left:50%; top:56%; width:0; height:0;
  transform-style:preserve-3d;
}
.tile{
  position:absolute; width:44px; height:44px; transform-style:preserve-3d;
}
/* wall faces of a building: 4 faces + roof; we build them as children */
.face{position:absolute; inset:0; backface-visibility:hidden}
/* road piece */
.road{
  position:absolute; border-radius:3px; background:#5E5A75;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18);
}
.road.h{width:46px;height:20px}
.road.v{width:20px;height:46px}
.road::after{ /* dashed centerline */
  content:""; position:absolute; inset:0; margin:auto;
  height:2px; width:60%; border-top:2px dashed rgba(255,255,255,.75);
}
.road.v::after{width:2px;height:60%;border-top:none;border-left:2px dashed rgba(255,255,255,.75)}
/* cars */
.car{
  position:absolute; width:16px; height:9px; border-radius:4px 5px 3px 3px;
  box-shadow:0 2px 4px rgba(40,30,45,.35); z-index:5;
}
.car::after{content:""; position:absolute; left:3px; top:2.5px; width:8px; height:4px;
  border-radius:2px; background:rgba(255,255,255,.7)}
/* streetlight */
.lamp{
  position:absolute; width:3px; height:34px; background:linear-gradient(#3E3A52,#2C2940);
  border-radius:2px; transform-origin:bottom center;
}
.lamp::after{
  content:""; position:absolute; top:-4px; left:-3.5px; width:10px; height:8px;
  border-radius:50% 50% 40% 40%; background:#FFF3D6;
  box-shadow:0 0 10px 2px rgba(255,224,150,.75);
}
/* fountain */
.fountain{position:absolute; width:44px; height:44px}
.fountain .basin{position:absolute; inset:6px; border-radius:50%;
  background:radial-gradient(circle at 38% 32%, #EAF6FF, #9CCBE8 70%); overflow:hidden}
.fountain .jet{
  position:absolute; left:50%; top:50%; width:4px; height:4px; border-radius:50%;
  background:#FFFFFF; opacity:.95;
  animation:jet 1.6s ease-out infinite;
}
@keyframes jet{
  0%{transform:translate(-50%,-50%) scale(1); opacity:.95}
  100%{transform:translate(-50%,-50%) translateY(-16px) scale(.4); opacity:0}
}
/* trees: layered discs */
.tree{position:absolute; width:26px; height:26px}
.tree i{position:absolute; border-radius:50%; background:radial-gradient(circle at 35% 30%, #B7E4BC, #7FBF8A 65%, #66A873)}
.tree i:nth-child(1){inset:0 0 6px 0}
.tree i:nth-4{display:none}
.tree i:nth-child(2){inset:3px 3px 9px; opacity:.92}
.tree i:nth-child(3){inset:5px 5px 12px; opacity:.85}
/* clouds around island */
.cloud{
  position:absolute; background:#FFFFFF; border-radius:99px; opacity:.9;
  box-shadow:0 6px 18px rgba(90,110,150,.18);
}
.cloud::before,.cloud::after{content:""; position:absolute; background:inherit; border-radius:50%}
.cloud::before{width:55%;height:150%;left:12%;bottom:20%}
.cloud::after{width:40%;height:110%;right:12%;bottom:30%}
@keyframes drift{from{transform:translateX(-40vw)}to{transform:translateX(140vw)}}
/* resident card */
.card{
  position:fixed; z-index:60; width:230px; padding:14px;
  background:#FFFDF8; border-radius:14px; border:1px solid #F0D9C8;
  box-shadow:0 18px 44px rgba(60,40,60,.28);
  opacity:0; transform:translateY(8px) scale(.94); pointer-events:none;
  transition:opacity .3s, transform .3s cubic-bezier(.34,1.56,.64,1);
}
.card.show{opacity:1; transform:translateY(0) scale(1); pointer-events:auto}
.card h3{font-size:14px; letter-spacing:.02em; margin-bottom:2px}
.card .role{font-size:11px; color:#C4552D; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px}
.card p{font-size:11.5px; line-height:1.55; color:#6E5F6B}
.card .avr{
  width:38px; height:38px; border-radius:12px; float:right; margin-left:10px;
  background:linear-gradient(135deg,#F6A9BF,#E7A3C6); display:grid; place-items:center;
  color:#fff; font-weight:800; font-size:15px;
}
.card .walk{font-family:"Courier New",monospace; font-size:9.5px; color:#9A8B98; margin-top:8px; letter-spacing:.05em}
/* toast */
.toast{
  position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(6px);
  background:rgba(46,36,64,.92); color:#FFF7EE; font-size:12px; font-weight:600;
  padding:8px 16px; border-radius:99px; opacity:0; transition:.35s; z-index:70;
  letter-spacing:.04em; pointer-events:none;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
/* reduced motion */
@media (prefers-reduced-motion:reduce){
  .bob,.cloud,.fountain .jet,.tree i{animation:none!important}
  html{scroll-behavior:auto}
}
@media (max-width:600px){
  .hint{display:none}
  .hud{gap:10px; padding:9px 12px}
  .hud-readout{min-width:90px; font-size:10px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="cube-mini" aria-hidden="true"></div>
    <h1>ISO<em>POP</em></h1>
  </div>
  <div class="clock" id="clock" role="timer" aria-live="off">07:30 · POPULATION 128</div>
</header>

<div class="stage" id="stage">
  <div class="diorama bob" id="diorama">
    <div class="rock" aria-hidden="true"></div>
    <div class="dirt" aria-hidden="true"></div>
    <div class="grass" aria-hidden="true"></div>
    <div class="world" id="world" aria-label="Isometric city diorama"></div>
    <div class="puddle" aria-hidden="true"></div>
  </div>
</div>

<div class="hud">
  <button class="sun-switch" id="sun" data-label="DAY / NIGHT" aria-pressed="false" aria-label="Toggle day and night"><span class="knob"></span></button>
  <div class="hud-readout" id="readout">TIME <b>07:30</b><br>CARS <b>4</b> · LAMPS <b>8</b></div>
  <div class="hint">Drag to orbit · Click a building<br>for a resident card</div>
</div>

<div class="card" id="card" role="dialog" aria-label="Resident card">
  <div class="avr" id="card-av">M</div>
  <h3 id="card-name">Mika</h3>
  <div class="role" id="card-role">Ceramicist</div>
  <p id="card-text">I throw tiny pots on a tiny wheel. The kiln is in the attic; the glazes are in the garden shed.</p>
  <div class="walk" id="card-walk">HOME · 4 MIN WALK TO FOUNTAIN SQUARE</div>
</div>

<div class="toast" id="toast" role="status">Good night, ISOPOP</div>

<script>
/* ISOPOP — chunk 1: geometry, palette, city factory */
"use strict";
const CSSID = document.getElementById.bind(document);
const world = CSSID("world");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const PALETTE = ["#F9C74F","#F4978E","#9AD0E0","#CDB4F6","#FCE3A0","#A8E6B0","#F6BFD0","#FDB67E"];
const PAPER  = ["#FFF8EC","#FFF4F6","#F2FAFF","#FAF4FF","#FFFBEE","#F3FCF5","#FFF5F8","#FFF6ED"];
const ROOFS  = ["#E8848C","#E49CB6","#84B6D8","#B58CD8","#EBB25E","#8CC98F","#D98CA8","#DE8E5B"];
const RESIDENTS = [
  {n:"Mika",r:"Ceramicist",t:"I throw tiny pots on a tiny wheel. The kiln is in the attic; the glazes live in the garden shed.",a:"M"},
  {n:"Juno",r:"Beekeeper",t:"Four hives on the roof. The bees commute to the park and back before most of us wake up.",a:"J"},
  {n:"Priya",r:"Lighthouse DJ",t:"I run the evening broadcast from the tower room — 30 watts of pure easy listening.",a:"P"},
  {n:"Oskar",r:"Trolley mechanic",t:"If the number 2 tram squeals at the corner, that is my fault and I will fix it Friday.",a:"O"},
  {n:"Wren",r:"Baker",t:"Sourdough goes in at five. You can smell it from fountain square, which is the point.",a:"W"},
  {n:"Sela",r:"Cloud cartographer",t:"I chart the islands that drift past on Tuesdays. Most of them are lost balloons.",a:"S"},
  {n:"Tam",r:"Streetlight poet",t:"I write one line per lamp per night. The avenue is a very long poem by now.",a:"T"}
];

const el = (tag, cls, parent) => {
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  if (parent) parent.appendChild(d);
  return d;
};
const put = (node, gx, gy, z) => {
  node.style.left = (gx * 44) + "px";
  node.style.top  = (gy * 44) + "px";
  if (z !== undefined) node.style.transform = "translateZ(" + z + "px)";
  return node;
};

/* ---- building: extruded box from 4 wall planes + roof, drawn flat ---- */
function makeBuilding(gx, gy, w, d, h, ci) {
  const b = el("div", "tile bldg", null);
  b.style.width = (w * 44) + "px";
  b.style.height = (d * 44) + "px";
  put(b, gx, gy, 0);
  b.dataset.resident = ci % RESIDENTS.length;
  const wall = PALETTE[ci % PALETTE.length];
  const roof = ROOFS[ci % ROOFS.length];
  /* flat top-down planes; the .iso parent tilts the whole world */
  const top = el("div", "face roof", b);
  top.style.background =
    "linear-gradient(135deg," + roof + " 0 48%," + shade(roof, -14) + " 48% 52%," + shade(roof, 12) + " 52%)";
  const lw = Math.round(w * 44 * 0.24), tw = Math.round(d * 44 * 0.2);
  /* left (south-west) facade */
  const L = el("div", "face side", b);
  L.style.left = "0"; L.style.width = lw + "px";
  L.style.background = "linear-gradient(180deg," + shade(wall, -22) + "," + shade(wall, -34) + ")";
  /* right (south-east) facade */
  const R = el("div", "face side", b);
  R.style.right = "0"; R.style.width = lw + "px";
  R.style.background = "linear-gradient(180deg," + shade(wall, -8) + "," + shade(wall, -20) + ")";
  /* back facades peek at the top edge */
  const T = el("div", "face side", b);
  T.style.top = "0"; T.style.height = tw + "px";
  T.style.background = shade(wall, -16);
  /* door */
  const door = el("div", "door", b);
  door.style.cssText = "position:absolute;left:50%;bottom:0;transform:translateX(-50%);" +
    "width:9px;height:13px;border-radius:5px 5px 0 0;background:" + shade(roof, -30) +
    ";box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)";
  /* windows grid on the two visible facades */
  const winHost = el("div", "wins", b);
  const rows = Math.max(1, Math.round(h / 26));
  const wl = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < Math.max(2, Math.round(w * 2)); c++) {
      const winEl = el("i", "win", winHost);
      winEl.style.left = (6 + lw + c * ((w * 44 - lw * 2 - 10) / Math.max(2, w * 2 - 1))) + "px";
      winEl.style.top = (7 + r * 24) + "px";
      wl.push(winEl);
    }
  }
  b._windows = wl;
  /* soft long shadow */
  const sh = el("div", "bshadow", b);
  sh.style.cssText = "position:absolute;left:" + (w * 44 * 0.1) + "px;top:" + (d * 44 * 0.85) +
    "px;width:" + (w * 44 * 1.15) + "px;height:" + (d * 44 * 0.5) +
    "px;background:linear-gradient(105deg,rgba(70,55,80,.28),rgba(70,55,80,0) 70%);" +
    "border-radius:50%;filter:blur(4px);z-index:-1";
  return b;
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, v + amt));
  return "#" + ((1 << 24) + (f(n >> 16) << 16) + (f((n >> 8) & 255) << 8) + f(n & 255)).toString(16).slice(1);
}
/* css for dynamic bits */
const st = document.createElement("style");
st.textContent =
  ".bldg{cursor:pointer} .bldg .side,.bldg .roof,.bldg .wins{position:absolute;pointer-events:none}" +
  ".bldg .roof{inset:0;border-radius:4px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}" +
  ".bldg .win{position:absolute;width:7px;height:9px;border-radius:2px;background:rgba(255,255,255,.75);" +
  "box-shadow:inset 0 1px 2px rgba(90,74,87,.4);transition:background .8s,box-shadow .8s}" +
  "body.night .bldg .win{background:rgba(255,214,140,.16)}" +
  "body.night .bldg .win.lit{background:#FFD68C;box-shadow:0 0 8px 1px rgba(255,205,110,.85)}" +
  ".bldg:hover .roof{filter:brightness(1.06)}";
document.head.appendChild(st);
/* ISOPOP — chunk 2: layout, roads, cars, lamps, park, day/night, drag, cards */
/* ---- assemble the town ---- */
const T = 44;
const bldgs = [];
function layout() {
  /* buildings: [gx,gy,w,d,h,ci] in grid units (grid -5..4) */
  const spec = [
    [-4,-4,2,2,40,0], [-1,-4,2,2,58,1], [ 2,-4,2,2,34,2],
    [-4,-1,2,2,62,3], [ 2,-1,2,2,44,4],
    [-4, 2,2,2,36,5], [-1, 2,2,2,70,6], [ 2, 2,2,2,50,7]
  ];
  spec.forEach(s => {
    const b = makeBuilding(s[0], s[1], s[2], s[3], s[4], s[5]);
    world.appendChild(b);
    bldgs.push(b);
  });
  /* roads: two loops */
  const roads = [
    [-3.6,-3.5,"h"],[-2.5,-3.5,"h"],[-1.4,-3.5,"h"],[-0.3,-3.5,"h"],[0.8,-3.5,"h"],[1.9,-3.5,"h"],
    [-3.6, 1.4,"h"],[-2.5, 1.4,"h"],[-1.4, 1.4,"h"],[-0.3, 1.4,"h"],[0.8, 1.4,"h"],[1.9, 1.4,"h"],
    [-3.7,-2.6,"v"],[-3.7,-1.5,"v"],[-3.7,-0.4,"v"],
    [ 2.1,-2.6,"v"],[ 2.1,-1.5,"v"],[ 2.1,-0.4,"v"]
  ];
  roads.forEach(r => {
    const rd = el("div", "road " + r[2], world);
    put(rd, r[0], r[1], 0);
  });
  /* streetlamps at corners */
  const lampSpots = [[-3.9,-3.7],[2.3,-3.7],[-3.9,1.6],[2.3,1.6],[-0.9,-3.7],[-0.9,1.6],[2.3,-1],[-3.9,-1]];
  lampSpots.forEach(s => {
    const L = el("div", "lamp", world);
    put(L, s[0], s[1], 0);
  });
  /* park in the middle with fountain + trees */
  const park = el("div", "tile park", world);
  park.style.cssText = "width:" + (2.1 * T) + "px;height:" + (2.1 * T) + "px;background:" +
    "radial-gradient(circle at 40% 35%,#B7E4BC,#94CF9A 70%);border-radius:14px;" +
    "box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),inset 0 0 18px rgba(60,120,70,.25)";
  put(park, -0.55, -2.45, 0);
  const ftn = el("div", "fountain", world);
  put(ftn, 0.15, -1.9, 0);
  const basin = el("div", "basin", ftn);
  el("i", "jet", basin);
  const trees = [[-1.5,-2.2],[-0.4,-2.9],[0.7,-2.3],[-1.3,-1.6],[0.6,-1.55]];
  trees.forEach(p => {
    const tr = el("div", "tree", world);
    put(tr, p[0], p[1], 0);
    el("i", "", tr); el("i", "", tr); el("i", "", tr);
  });
}
layout();

/* ---- cars on the circuits ---- */
const cars = [];
function makeCars() {
  const palette = ["#F94144","#F8961E","#43AA8B","#577590","#C75146"];
  for (let i = 0; i < 5; i++) {
    const c = el("div", "car", world);
    c.style.background = "linear-gradient(180deg," + shade(palette[i % 5], 18) + "," + palette[i % 5] + ")";
    c.style.transform = "translateZ(1px)";
    world.appendChild(c);
    cars.push({ node: c, loop: i % 2, t: i * 0.19, speed: 0.055 + i * 0.007 });
  }
}
makeCars();
/* two rectangular circuits in grid coords */
const LOOPS = [
  [ [[-3.6,-3.4],[ 2.1,-3.4],[ 2.1, 1.5],[-3.6, 1.5],[-3.6,-3.4]] ],
  [ [[-2.6,-2.4],[ 1.2,-2.4],[ 1.2, 0.6],[-2.6, 0.6],[-2.6,-2.4]] ]
];
function lerpPt(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}
function loopPoint(loop, u) {
  const pts = LOOPS[loop][0];
  const seg = Math.min(3, Math.floor(u * 4));
  const t = u * 4 - seg;
  return lerpPt(pts[seg], pts[seg + 1], t);
}
function moveCars(dt) {
  cars.forEach(c => {
    c.t = (c.t + c.speed * dt) % 1;
    const p = loopPoint(c.loop, c.t);
    const q = loopPoint(c.loop, (c.t + 0.008) % 1);
    const ang = Math.atan2((q[1] - p[1]) * T, (q[0] - p[0]) * T) * 180 / Math.PI;
    c.node.style.left = (p[0] * T) + "px";
    c.c = 0;
    c.node.style.top = (p[1] * T) + "px";
    c.node.style.transform = "translateZ(1px) rotate(" + ang + "deg)";
  });
}
moveCars(0);

/* ---- clock & window day-rhythm ---- */
const clockEl = CSSID("clock");
const readout = CSSID("readout");
let gameMin = 7 * 60 + 30; /* start 07:30 */
let lastT = performance.now();
function fmtTime(m) {
  const hh = Math.floor(m / 60) % 24, mm = Math.floor(m % 60);
  return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
}
function updateReadout() {
  clockEl.textContent = fmtTime(gameMin) + " · POPULATION 128";
  readout.innerHTML = "TIME <b>" + fmtTime(gameMin) + "</b><br>CARS <b>5</b> · LAMPS <b>8</b>";
}
updateReadout();
/* windows light/dim on a day rhythm */
let rhythmT = 0;
function dayRhythm(dt) {
  rhythmT += dt;
  if (rhythmT < 0.55) return;
  rhythmT = 0;
  gameMin = (gameMin + 3) % 1440;
  updateReadout();
  const nightNow = isNight();
  const depth = windowDepth();
  bldgs.forEach((b, bi) => {
    (b._windows || []).forEach((w, wi) => {
      /* deterministic pseudo-random per window */
      const seed = (bi * 31 + wi * 7) % 100 / 100;
      const on = nightNow && seed < depth;
      w.classList.toggle("lit", on);
    });
  });
}
function isNight() { return document.body.classList.contains("night"); }
function windowDepth() {
  const h = gameMin / 60;
  if (h >= 20 || h < 5) return 0.85;
  if (h >= 18) return 0.55;
  if (h < 7) return 0.5;
  return 0.12;
}

/* ---- main loop ---- */
let running = true;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (!reduceMotion) moveCars(dt);
  dayRhythm(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---- day/night toggle ---- */
const sunBtn = CSSID("sun");
const toast = CSSID("toast");
let toastT = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => toast.classList.remove("show"), 2200);
}
sunBtn.addEventListener("click", () => {
  const night = document.body.classList.toggle("night");
  sunBtn.setAttribute("aria-pressed", night ? "true" : "false");
  showToast(night ? "Good night, ISOPOP — lamps on" : "Good morning — lamps off");
  document.querySelectorAll(".lamp").forEach(l => l.classList.add("flick"));
  setTimeout(() => document.querySelectorAll(".lamp").forEach(l => l.classList.remove("flick")), 900);
});
const flickCSS = document.createElement("style");
flickCSS.textContent =
  "@keyframes lampFlick{0%,100%{opacity:1}20%{opacity:.2}45%{opacity:.9}60%{opacity:.35}} " +
  ".lamp.flick{animation:lampFlick .9s ease-in-out}";
document.head.appendChild(flickCSS);
/* lamp glow only at night */
const lampNightCSS = document.createElement("style");
lampNightCSS.textContent =
  "body:not(.night) .lamp::after{background:#EDE7DC;box-shadow:none} " +
  "body.night .puddle{background:radial-gradient(ellipse,rgba(20,16,40,.5),transparent 70%)}";
document.head.appendChild(lampNightCSS);

/* ---- drag to orbit ---- */
const stage = CSSID("stage");
const diorama = CSSID("diorama");
let spin = -28, tilt = 56, spinV = 0, tiltV = 0;
let dragging = false, lx = 0, ly = 0, movedFar = false;
function applyView() {
  world.style.transform = "rotateX(" + tilt + "deg) rotateZ(" + spin + "deg)";
}
applyView();
stage.addEventListener("pointerdown", e => {
  dragging = true; movedFar = false; lx = e.clientX; ly = e.clientY;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  if (Math.abs(dx) + Math.abs(dy) > 6) movedFar = true;
  spin = clamp(spin + dx * 0.12, -46, 8);
  tilt = clamp(tilt + dy * 0.06, 42, 68);
  lx = e.clientX; ly = e.clientY;
  applyView();
});
const endDrag = e => { dragging = false; };
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/* ---- resident cards ---- */
const card = CSSID("card");
world.addEventListener("click", e => {
  if (movedFar) return;
  const b = e.target.closest ? e.target.closest(".bldg") : null;
  if (!b) { card.classList.remove("show"); return; }
  const r = RESIDENTS[+b.dataset.resident % RESIDENTS.length];
  CSSID("card-av").textContent = r.a;
  CSSID("card-name").textContent = r.n;
  CSSID("card-role").textContent = r.r;
  CSSID("card-text").textContent = r.t;
  CSSID("card-walk").textContent = r.n.toUpperCase() + " · HOME · " + (2 + (+b.dataset.resident) * 2 % 9) + " MIN TO FOUNTAIN SQ";
  const rect = b.getBoundingClientRect();
  const cw = 230;
  card.style.left = clamp(rect.left + rect.width / 2 - cw / 2, 12, window.innerWidth - cw - 12) + "px";
  card.style.top = clamp(rect.top - 250, 12, window.innerHeight - 300) + "px";
  card.classList.add("show");
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") card.classList.remove("show");
});
/* dismiss when tapping elsewhere */
document.addEventListener("pointerdown", e => {
  if (!card.contains(e.target) && !e.target.closest(".bldg")) card.classList.remove("show");
}, true);

/* ---- clouds ---- */
(function clouds() {
  if (reduceMotion) return;
  for (let i = 0; i < 4; i++) {
    const c = el("div", "cloud", document.body);
    const w = 70 + Math.random() * 90;
    c.style.width = w + "px";
    c.style.height = w * 0.32 + "px";
    c.style.top = (8 + Math.random() * 40) + "vh";
    c.style.animation = "drift " + (60 + i * 24) + "s linear infinite";
    c.style.animationDelay = -i * 18 + "s";
    c.style.opacity = 0.55 + Math.random() * 0.3;
    if (i % 2) c.style.zIndex = "-1";
  }
})();
</script>
