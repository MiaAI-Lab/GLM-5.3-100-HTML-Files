<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THREE BODY — a gravity playground</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background:#08090f; color:#c9d2e8; touch-action:none; user-select:none; -webkit-user-select:none;
    display:flex;
  }
  canvas#space { flex:1; display:block; cursor:crosshair; touch-action:none; }
  /* star backdrop */
  canvas#stars { position:fixed; inset:0; z-index:-1; }

  aside {
    width:240px; flex-shrink:0; padding:22px 18px; display:flex; flex-direction:column; gap:16px;
    background:rgba(10,12,20,.82); border-left:1px solid rgba(140,160,220,.14);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); overflow-y:auto; z-index:5;
  }
  h1 { font-size:15px; font-weight:300; letter-spacing:.42em; text-transform:uppercase; color:#e8eefb; }
  h1 small { display:block; font-size:9px; color:#67729a; letter-spacing:.22em; margin-top:5px; }
  .grp label { display:flex; justify-content:space-between; font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:#67729a; margin-bottom:7px; }
  .grp label output { color:#c9d2e8; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:3px; border-radius:99px; background:#2a3350; outline:none; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#c9d2e8; box-shadow:0 0 8px rgba(160,190,255,.8); cursor:grab; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .btns button {
    flex:1; min-width:64px; background:rgba(140,160,220,.08); color:#c9d2e8; border:1px solid rgba(140,160,220,.3);
    border-radius:9px; font:inherit; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    padding:9px 6px; cursor:pointer; transition:all .15s;
  }
  .btns button:hover { background:rgba(140,160,220,.22); }
  .btns button.on { background:#5a7ac9; border-color:#5a7ac9; color:#fff; }
  .hint { font-size:9.5px; line-height:1.7; color:#5a6488; }
  .hint b { color:#9fb0d8; }
  .telemetry { margin-top:auto; padding-top:10px; border-top:1px solid rgba(140,160,220,.12);
    font-family:"Courier New", monospace; font-size:10px; color:#67729a; line-height:1.9; }
  .telemetry b { color:#c9d2e8; font-weight:400; }

  @media (max-width:700px) {
    body { flex-direction:column; }
    aside { width:100%; order:2; flex-direction:row; flex-wrap:wrap; border-left:none; border-top:1px solid rgba(140,160,220,.14); max-height:40vh; }
    .grp { flex:1; min-width:120px; } h1 { width:100%; } .hint,.telemetry { display:none; }
    canvas#space { order:1; }
  }
</style>
</head>
<body>
  <canvas id="stars"></canvas>
  <canvas id="space"></canvas>
  <aside>
    <h1>Three Body<small>newtonian sandbox · 0friction</small></h1>
    <div class="grp">
      <label>new mass <output id="oM">40</output></label>
      <input type="range" id="rM" min="6" max="120" value="40">
    </div>
    <div class="grp">
      <label>trail memory <output id="oT">full</output></label>
      <input type="range" id="rT" min="0" max="100" value="90">
    </div>
    <div class="btns">
      <button id="bPause">pause</button>
      <button id="bStep">step</button>
      <button id="bClear">trails</button>
    </div>
    <div class="btns">
      <button data-p="binary">binary</button>
      <button data-p="eight">figure-8</button>
      <button data-p="chaos">chaos</button>
    </div>
    <div class="grp">
      <label>gravity <output id="oG">1.0</output></label>
      <input type="range" id="rG" min="10" max="300" value="100">
    </div>
    <p class="hint">
      <b>Drag from any point</b> to spawn a body with aimed velocity — the rubber band shows the launch vector.
      Click a body to absorb it. Presets restart the whole system. Trails fade like light-painting.
    </p>
    <div class="telemetry">
      bodies <b id="tN">3</b><br>
      kinetic <b id="tK">—</b><br>
      <span id="tS" style="color:#5a7ac9;">stable-ish</span>
    </div>
  </aside>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const cv = $("space"), g = cv.getContext("2d");
  const st = $("stars"), sg = st.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  let bodies = [], paused = false, G = 1.0, trailKeep = 0.9;
  const COLORS = ["#ffb36b", "#6bd0ff", "#c9a0ff", "#8affc0", "#ff8a9a", "#ffe98a"];
  let nextColor = 0;

  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    st.width = W; st.height = H;
    paintStars();
  }
  function paintStars() {
    sg.fillStyle = "#08090f"; sg.fillRect(0, 0, W, H);
    for (let i = 0; i < 240; i++) {
      const b = Math.random() * 200 + 30;
      sg.fillStyle = "rgba(" + b + "," + b + "," + (b + 20) + "," + (Math.random() * 0.5 + 0.2) + ")";
      sg.fillRect(Math.random() * W, Math.random() * H, Math.random() < 0.1 ? 2 : 1, Math.random() < 0.1 ? 2 : 1);
    }
  }
  addEventListener("resize", resize);
  resize();

  /* ---------- presets ---------- */
  function addBody(x, y, vx, vy, mass, color) {
    bodies.push({ x, y, vx, vy, m: mass, r: Math.max(3, Math.cbrt(mass) * 1.7), color: color || COLORS[nextColor++ % COLORS.length], trail: [] });
  }
  function preset(name) {
    bodies = []; nextColor = 0;
    const cx = W / 2, cy = H / 2;
    if (name === "binary") {
      const r = Math.min(W, H) * 0.18;
      const v = Math.sqrt(G * 900 / (2 * r)) * 0.85;
      addBody(cx - r, cy, 0, v, 900, "#ffb36b");
      addBody(cx + r, cy, 0, -v, 900, "#6bd0ff");
      addBody(cx, cy - r * 2.1, 3.4, 0, 6, "#c9a0ff");
    } else if (name === "eight") {
      /* chenciner–montgomery figure-eight, scaled + approximated */
      const s = Math.min(W, H) / 420;
      const p1 = [0.97000436, -0.24308753], v3 = [0.93240737, 0.86473146];
      const k = 34 * s;
      addBody(cx + p1[0] * k, cy + p1[1] * k, -v3[0] * 0.32, -v3[1] * 0.32, 600, "#ffb36b");
      addBody(cx - p1[0] * k, cy - p1[1] * k, -v3[0] * 0.32, -v3[1] * 0.32, 600, "#6bd0ff");
      addBody(cx, cy, v3[0] * 0.64, v3[1] * 0.64, 600, "#c9a0ff");
    } else {
      for (let i = 0; i < 3; i++) {
        const a = Math.random() * 6.283;
        const r = Math.min(W, H) * (0.1 + Math.random() * 0.2);
        addBody(cx + Math.cos(a) * r, cy + Math.sin(a) * r, (Math.random() - 0.5) * 2.4, (Math.random() - 0.5) * 2.4, 300 + Math.random() * 600);
      }
    }
    updateTelemetry();
  }

  /* ---------- physics ---------- */
  function step() {
    const dt = 1;
    for (let i = 0; i < bodies.length; i++) {
      let ax = 0, ay = 0;
      for (let j = 0; j < bodies.length; j++) {
        if (i === j) continue;
        const dx = bodies[j].x - bodies[i].x, dy = bodies[j].y - bodies[i].y;
        const d2 = dx * dx + dy * dy + 400;
        const inv = G * 60 / (d2 * Math.sqrt(d2));
        ax += dx * inv * bodies[j].m / 60;
        ay += dy * inv * bodies[j].m / 60;
      }
      bodies[i].vx += ax * dt;
      bodies[i].vy += ay * dt;
    }
    bodies.forEach(b => {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.trail.push({ x: b.x, y: b.y });
      const maxTrail = Math.floor(30 + trailKeep * 240);
      if (b.trail.length > maxTrail) b.trail.shift();
    });
  }

  /* ---------- render ---------- */
  function draw() {
    g.clearRect(0, 0, W, H);
    bodies.forEach(b => {
      /* trail */
      b.trail.forEach((p, i) => {
        const a = (i / b.trail.length) * 0.5;
        g.fillStyle = hexA(b.color, a);
        g.fillRect(p.x - 1, p.y - 1, 2, 2);
      });
      /* glow */
      const rg = g.createRadialGradient(b.x, b.y, 1, b.x, b.y, b.r * 3.4);
      rg.addColorStop(0, hexA(b.color, 0.55));
      rg.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = rg;
      g.beginPath(); g.arc(b.x, b.y, b.r * 3.4, 0, 6.283); g.fill();
      /* body */
      g.fillStyle = b.color;
      g.beginPath(); g.arc(b.x, b.y, b.r, 0, 6.283); g.fill();
      g.fillStyle = "rgba(255,255,255,.35)";
      g.beginPath(); g.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.32, 0, 6.283); g.fill();
    });
  }
  function hexA(hex, a) {
    const r = parseInt(hex.slice(1, 3), 16), gg = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return "rgba(" + r + "," + gg + "," + b + "," + a + ")";
  }

  function loop() {
    requestAnimationFrame(loop);
    if (document.hidden) return;
    if (!paused) step();
    draw();
    if (Math.random() < 0.05) updateTelemetry();
  }
  requestAnimationFrame(loop);

  function updateTelemetry() {
    $("tN").textContent = bodies.length;
    let ke = 0;
    bodies.forEach(b => ke += 0.5 * b.m * (b.vx * b.vx + b.vy * b.vy));
    $("tK").textContent = (ke / 100000).toFixed(1) + " ×10⁵";
    $("tS").textContent = bodies.length === 0 ? "empty void" : ke > 4e6 ? "flying apart" : bodies.length === 3 ? "three body" : bodies.length + " body";
  }

  /* ---------- spawn: drag to aim ---------- */
  let aiming = null;
  cv.addEventListener("pointerdown", (e) => {
    /* absorb on direct hit */
    for (let i = bodies.length - 1; i >= 0; i--) {
      const b = bodies[i];
      if (Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r + 6) {
        bodies.splice(i, 1);
        pop();
        updateTelemetry();
        return;
      }
    }
    aiming = { x: e.clientX, y: e.clientY };
    cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove", (e) => {
    if (aiming) aiming.cx = e.clientX, aiming.cy = e.clientY;
  });
  cv.addEventListener("pointerup", (e) => {
    if (!aiming) return;
    const mass = parseInt($("rM").value, 10);
    const dx = (aiming.cx !== undefined ? aiming.cx - aiming.x : 0);
    const dy = (aiming.cy !== undefined ? aiming.cy - aiming.y : 0);
    addBody(aiming.x, aiming.y, dx * 0.05, dy * 0.05, mass * 10);
    aiming = null;
    pop();
    updateTelemetry();
  });

  /* aim band drawn over */
  const bandLoop = () => {
    requestAnimationFrame(bandLoop);
    if (aiming && aiming.cx !== undefined) {
      g.save();
      g.strokeStyle = "rgba(200,220,255,.6)";
      g.setLineDash([5, 6]);
      g.lineWidth = 1.4;
      g.beginPath();
      g.moveTo(aiming.x, aiming.y);
      g.lineTo(aiming.cx, aiming.cy);
      g.stroke();
      g.setLineDash([]);
      g.beginPath(); g.arc(aiming.x, aiming.y, 5, 0, 6.283); g.stroke();
      g.restore();
    }
  };
  requestAnimationFrame(bandLoop);

  /* ---------- audio ---------- */
  let AC = null;
  function pop() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
    if (!AC) return;
    try {
      if (AC.state === "suspended") AC.resume().catch(() => {});
      const t0 = AC.currentTime;
      const o = AC.createOscillator(), gn = AC.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(300, t0);
      o.frequency.exponentialRampToValueAtTime(140, t0 + 0.18);
      gn.gain.setValueAtTime(0.05, t0);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
      o.connect(gn); gn.connect(AC.destination);
      o.start(t0); o.stop(t0 + 0.22);
    } catch (e) {}
  }

  /* ---------- controls ---------- */
  $("bPause").addEventListener("click", function () { paused = !paused; this.classList.toggle("on", paused); this.textContent = paused ? "resume" : "pause"; });
  $("bStep").addEventListener("click", () => { step(); });
  $("bClear").addEventListener("click", () => { bodies.forEach(b => b.trail = []); });
  document.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", function () {
    document.querySelectorAll("[data-p]").forEach(x => x.classList.remove("on"));
    this.classList.add("on");
    preset(this.dataset.p);
  }));
  $("rG").addEventListener("input", (e) => { G = parseInt(e.target.value, 10) / 100; $("oG").textContent = G.toFixed(1); });
  $("rT").addEventListener("input", (e) => { trailKeep = parseInt(e.target.value, 10) / 100; $("oT").textContent = trailKeep > 0.66 ? "full" : trailKeep > 0.33 ? "medium" : "short"; });
  $("rM").addEventListener("input", (e) => { $("oM").textContent = e.target.value; });

  preset("binary");
  document.querySelector('[data-p="binary"]').classList.add("on");
})();
</script>
</body>
</html>
