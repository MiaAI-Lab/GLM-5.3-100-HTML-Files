<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZELLIGE — the mosaic maker</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background:#241a12; color:#e8dcc8;
    display:flex; touch-action:none; user-select:none; -webkit-user-select:none;
  }
  /* plaster room */
  body::before {
    content:""; position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,220,160,.07), transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(200,120,60,.05), transparent 50%);
    pointer-events:none;
  }
  canvas#art { flex:1; display:block; cursor:crosshair; touch-action:none; }

  aside {
    width:230px; flex-shrink:0; padding:22px 18px; display:flex; flex-direction:column; gap:16px;
    background:rgba(20,14,9,.82); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-left:1px solid rgba(232,220,200,.14); overflow-y:auto; z-index:5;
  }
  h1 { font-size:15px; font-weight:300; letter-spacing:.44em; text-transform:uppercase; color:#f2e6d0; }
  h1 small { display:block; font-size:9px; letter-spacing:.22em; color:#a08c6e; margin-top:5px; }
  .grp label { display:flex; justify-content:space-between; font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:#a08c6e; margin-bottom:7px; }
  .grp label output { color:#e8dcc8; }
  .palejava { display:grid; grid-template-columns:repeat(5, 1fr); gap:7px; }
  .palejava button {
    aspect-ratio:1; border:none; cursor:pointer; border-radius:5px; position:relative;
    border:2px solid transparent; transition:all .15s;
    box-shadow: inset 0 0 6px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.22);
  }
  .palejava button.on { border-color:#f2e6d0; transform:scale(1.1); }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; }
  .btnrow button {
    flex:1; min-width:70px; background:rgba(242,230,208,.08); color:#e8dcc8;
    border:1px solid rgba(242,230,208,.25); border-radius:9px; font:inherit; font-size:10px;
    letter-spacing:.14em; text-transform:uppercase; padding:9px 6px; cursor:pointer; transition:all .15s;
  }
  .btnrow button:hover { background:rgba(242,230,208,.2); }
  input[type=range] {
    -webkit-appearance:none; appearance:none; width:100%; height:3px; background:rgba(232,220,200,.25); border-radius:99px; outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#f2e6d0; cursor:grab; }
  input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#f2e6d0; border:none; }
  .hint { font-size:9.5px; line-height:1.7; color:#8a795f; letter-spacing:.05em; }
  .hint b { color:#cbb994; }
  .status { font-size:9px; letter-spacing:.2em; color:#6a5c46; text-transform:uppercase; text-align:center; margin-top:auto; padding-top:12px; border-top:1px solid rgba(232,220,200,.1); }
  .lattice {
    position:fixed; inset:0; pointer-events:none; z-index:4; opacity:0; transition:opacity .5s;
    background-image:
      repeating-linear-gradient(60deg, transparent 0 46px, rgba(212,175,55,.14) 46px 48px),
      repeating-linear-gradient(-60deg, transparent 0 46px, rgba(212,755,55,.14) 46px 48px);
  }
  .lattice.on { opacity:1; }
  @media (max-width:700px) {
    body { flex-direction:column; }
    aside { width:100%; order:2; border-left:none; border-top:1px solid rgba(232,220,200,.14); flex-direction:row; flex-wrap:wrap; max-height:42vh; }
    .grp { flex:1; min-width:130px; }
    h1 { width:100%; } .hint, .status { display:none; }
    canvas#art { order:1; }
  }
</style>
</head>
<body>
  <canvas id="art"></canvas>
  <div class="lattice" id="lattice"></div>
  <aside>
    <h1>Zellige<small>fez · hand-cut mosaic</small></h1>
    <div class="grp">
      <label>glazes</label>
      <div class="palejava" id="palette">
        <button class="on" data-c="#1d5c8a" style="background:#1d5c8a" title="cobalt"></button>
        <button data-c="#0f7a4d" style="background:#0f7a4d" title="emerald"></button>
        <button data-c="#d9a521" style="background:#d9a521" title="saffron"></button>
        <button data-c="#e8e0cc" style="background:#e8e0cc" title="ivory"></button>
        <button data-c="#b4552d" style="background:#b4552d" title="terracotta"></button>
        <button data-c="#7a2e5c" style="background:#7a2e5c" title="mulberry"></button>
        <button data-c="#2a9d8f" style="background:#2a9d8f" title="sea glaze"></button>
        <button data-c="#3c3f45" style="background:#3c3f45" title="smoke"></button>
        <button data-c="#c9a0dc" style="background:#c9a0dc" title="orchid ash"></button>
        <button data-c="#e2634f" style="background:#e2634f" title="coral kiln"></button>
      </div>
    </div>
    <div class="grp">
      <label>Symmetry <output id="oSym">8</output></label>
      <input type="range" id="rSym" min="1" max="12" value="8">
    </div>
    <div class="grp">
      <label>Grout <output id="oGrout">#241a12</output></label>
      <input type="range" id="rGrout" min="0" max="100" value="30">
    </div>
    <div class="btnrow">
      <button id="bClear">sweep</button>
      <button id="bLattice">lattice</button>
      <button id="bExport">save png</button>
    </div>
    <p class="hint">
      <b>Click or drag</b> to set hand-cut tiles. Every placement mirrors around the center
      with 8-fold symmetry — a live kaleidoscope of cut glaze.
      Random rotation on each tile keeps it human.
    </p>
    <div class="status" id="status">0 tiles set</div>
  </aside>

<script>
(() => {
  "use strict";
  const cv = document.getElementById("art");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, CX = 0, CY = 0, DPR = 1;
  let color = "#1d5c8a", sym = 8, grout = "#241a12";
  let tiles = 0, snap = null;

  /* zellige tile shapes drawn directly with transforms */
  function drawTile(x, y, s, kind, rot, col) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    if (kind === 0) {
      for (let i = 0; i < 16; i++) {
        const a = (Math.PI * 2 * i) / 16 + Math.PI / 16;
        const r = i % 2 === 0 ? s : s * 0.44;
        const px = Math.cos(a) * r, py = Math.sin(a) * r;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
    } else if (kind === 1) {
      ctx.moveTo(0, -s); ctx.lineTo(s * 0.62, 0); ctx.lineTo(0, s * 0.9); ctx.lineTo(-s * 0.62, 0);
    } else if (kind === 2) {
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI * 2 * i) / 6;
        i ? ctx.lineTo(Math.cos(a) * s * 0.9, Math.sin(a) * s * 0.9) : ctx.moveTo(Math.cos(a) * s * 0.9, Math.sin(a) * s * 0.9);
      }
    } else {
      ctx.moveTo(0, -s);
      ctx.quadraticCurveTo(s * 0.7, -s * 0.2, 0, s);
      ctx.quadraticCurveTo(-s * 0.7, -s * 0.2, 0, -s);
    }
    ctx.closePath();
    /* glaze fill with soft interior sheen */
    const grd = ctx.createLinearGradient(-s, -s, s, s);
    grd.addColorStop(0, col);
    grd.addColorStop(0.55, col);
    grd.addColorStop(1, shade(col, -0.25));
    ctx.fillStyle = grd;
    ctx.fill();
    /* irregular hand-cut inner edge */
    ctx.strokeStyle = shade(col, -0.42);
    ctx.lineWidth = 1.2;
    ctx.stroke();
    /* glaze highlight */
    ctx.beginPath();
    ctx.ellipse(-s * 0.24, -s * 0.3, s * 0.34, s * 0.18, -0.6, 0, 6.283);
    ctx.fillStyle = "rgba(255,255,255,.2)";
    ctx.fill();
    ctx.restore();
  }
  function shade(hex, amt) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    const f = (v) => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));
    return "rgb(" + f(r) + "," + f(g) + "," + f(b) + ")";
  }

  /* ---------- placement with radial symmetry ---------- */
  function place(px, py, sOverride) {
    const n = sym;
    const dx = px - CX, dy = py - CY;
    const r = Math.hypot(dx, dy);
    const a = Math.atan2(dy, dx);
    const size = sOverride || (16 + Math.random() * 10);
    const kind = Math.floor(Math.random() * 4);
    for (let k = 0; k < n; k++) {
      const rot = (Math.PI * 2 / n) * k;
      const x = CX + Math.cos(a + rot) * r;
      const y = CY + Math.sin(a + rot) * r;
      drawTile(x, y, size, kind, Math.random() * Math.PI * 2, color);
      /* mirror pass */
      drawTile(CX + Math.cos(-a + rot) * r, CY + Math.sin(-a + rot) * r, size, kind, Math.random() * Math.PI * 2, color);
    }
    tiles += n * 2;
    document.getElementById("status").textContent = tiles + " tiles set";
  }

  /* ---------- canvas setup ---------- */
  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1);
    const r = cv.getBoundingClientRect();
    let old = null;
    if (cv.width > 0) {
      try { old = document.createElement("canvas"); old.width = cv.width; old.height = cv.height; old.getContext("2d").drawImage(cv, 0, 0); } catch (e) {}
    }
    W = r.width; H = r.height;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    base();
    if (old) { ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(old, 0, 0, cv.width, cv.height); ctx.restore(); }
    CX = W / 2; CY = H / 2;
  }
  function base() {
    ctx.fillStyle = grout;
    ctx.fillRect(0, 0, W, H);
    /* subtle plaster noise */
    for (let i = 0; i < 400; i++) {
      ctx.fillStyle = "rgba(255,240,210," + (Math.random() * 0.02) + ")";
      ctx.fillRect(Math.random() * W, Math.random() * H, 2, 2);
    }
  }

  /* ---------- input ---------- */
  let down = false, lastPlace = 0;
  cv.addEventListener("pointerdown", (e) => {
    down = true;
    place(e.clientX, e.clientY);
    cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove", (e) => {
    if (!down) return;
    const now = performance.now();
    if (now - lastPlace > 90) {
      lastPlace = now;
      place(e.clientX, e.clientY);
    }
  });
  addEventListener("pointerup", () => { down = false; });

  /* ---------- controls ---------- */
  document.querySelectorAll("#palette button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("#palette button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    color = b.dataset.c;
  }));
  const rSym = document.getElementById("rSym");
  rSym.addEventListener("input", () => {
    sym = parseInt(rSym.value, 10);
    document.getElementById("oSym").textContent = sym;
  });
  const rGrout = document.getElementById("rGrout");
  rGrout.addEventListener("input", () => {
    const v = parseInt(rGrout.value, 10) / 100;
    /* grout from dark umber to pale sand */
    const c1 = [36, 26, 18], c2 = [222, 210, 186];
    const mix = c1.map((c, i) => Math.round(c + (c2[i] - c) * v));
    grout = "rgb(" + mix.join(",") + ")";
    document.getElementById("oGrout").textContent = grout;
  });
  document.getElementById("bClear").addEventListener("click", () => {
    tiles = 0; base();
    document.getElementById("status").textContent = "0 tiles set";
  });
  document.getElementById("bLattice").addEventListener("click", function () {
    this.classList.toggle("on");
    document.getElementById("lattice").classList.toggle("on");
  });
  document.getElementById("bExport").addEventListener("click", () => {
    try {
      const a = document.createElement("a");
      a.download = "zellige-" + Date.now() + ".png";
      a.href = cv.toDataURL("image/png");
      a.click();
    } catch (e) {}
  });

  addEventListener("resize", resize);
  resize();
  /* seed an 8-fold star at center */
  setTimeout(() => {
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI * 2 * i) / 6;
      place(CX + Math.cos(a) * 60, CY + Math.sin(a) * 60, 14);
    }
  }, 300);
})();
</script>
</body>
</html>
