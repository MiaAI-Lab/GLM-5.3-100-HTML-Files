<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORACLE — the fortune ball</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow-x:hidden; }
  body {
    font-family: Georgia, "Palatino Linotype", serif;
    background:radial-gradient(ellipse at 50% 20%, #1c1018, #0c070c 70%);
    color:#d8c8d0; display:flex; flex-direction:column; align-items:center;
    padding:40px 16px 60px; min-height:100vh;
  }
  header { text-align:center; margin-bottom:30px; }
  header h1 { font-size:clamp(24px, 4.4vw, 40px); font-weight:400; letter-spacing:.56em; color:#e0c8d8; text-transform:uppercase; }
  header p { font-family:system-ui, sans-serif; font-size:9px; letter-spacing:.4em; color:#7a5a68; text-transform:uppercase; margin-top:10px; }

  /* séance table */
  .table { display:flex; align-items:center; gap:44px; flex-wrap:wrap; justify-content:center; }
  /* candles */
  .candles { display:flex; flex-direction:column; gap:22px; }
  .candle { position:relative; width:18px; }
  .candle .stick {
    width:16px; height:70px; background:linear-gradient(90deg, #d8c5a8, #f0e4cc 45%, #c9b896);
    border-radius:3px 3px 1px 1px; margin:0 auto;
    box-shadow:0 0 18px 4px rgba(255,170,90,.12);
  }
  .candle .flame {
    width:11px; height:19px; margin:0 auto -4px; border-radius:50% 50% 44% 56% / 62% 62% 38% 38%;
    background:radial-gradient(ellipse at 50% 76%, #fff8e0 0%, #ffd27a 36%, #ff9a3c 64%, rgba(255,90,30,0) 84%);
    box-shadow:0 0 18px 7px rgba(255,160,70,.4), 0 0 52px 20px rgba(255,120,40,.12);
    animation:flick 2.2s ease-in-out infinite; transform-origin:50% 100%;
  }
  @keyframes flick {
    0%,100% { transform:scale(1) skewX(0); }
    30% { transform:scale(1.06, 1.12) skewX(2deg); }
    60% { transform:scale(.95) skewX(-2deg); }
    80% { transform:scale(1.04, 1.06) skewX(1deg); }
  }
  .candle:nth-child(2) .flame { animation-delay:.7s; }
  .candle:nth-child(3) .flame { animation-delay:1.3s; }

  /* the ball */
  .ballwrap { position:relative; }
  .stand {
    position:absolute; left:50%; bottom:-16px; transform:translateX(-50%);
    width:150px; height:30px;
    background:linear-gradient(180deg, #8a6e3a, #5a4426 60%, #3a2c18);
    border-radius:10px 10px 18px 18px;
    box-shadow:0 12px 30px rgba(0,0,0,.6);
  }
  .stand::before, .stand::after { /* brass claw feet */
    content:""; position:absolute; top:-8px; width:22px; height:14px;
    background:radial-gradient(circle at 40% 30%, #d4b46a, #8a6e2e);
    border-radius:4px 12px 4px 4px;
  }
  .stand::before { left:8px; transform:rotate(-24deg); }
  .stand::after { right:8px; transform:rotate(24deg) scaleX(-1); }
  .ball {
    position:relative; width:min(300px, 74vw); aspect-ratio:1; border-radius:50%;
    background:
      radial-gradient(circle at 34% 28%, rgba(255,255,255,.34) 0 7%, transparent 22%),
      radial-gradient(circle at 50% 50%, #1e1430 0%, #120a20 58%, #080510 100%);
    box-shadow:
      0 0 44px 10px rgba(120,80,200,.22),
      0 0 120px 40px rgba(80,50,160,.12),
      inset 0 -20px 50px rgba(0,0,0,.7);
    cursor:pointer; overflow:hidden;
    transition:box-shadow .8s;
  }
  .ball.charging { box-shadow:
    0 0 70px 22px rgba(120,80,220,.4),
    0 0 180px 70px rgba(90,60,200,.2),
    inset 0 -20px 50px rgba(0,0,0,.7);
  }
  /* inner nebula swirl */
  .ball .mist {
    position:absolute; inset:8%;
    border-radius:50%;
    background:conic-gradient(from 0deg,
      rgba(140,90,220,.28), rgba(60,140,200,.2), rgba(200,90,160,.26),
      rgba(90,60,180,.22), rgba(140,90,220,.28));
    filter:blur(16px);
    animation:swirl 16s linear infinite;
    opacity:.85;
  }
  @keyframes swirl { to { transform:rotate(360deg); } }
  .ball .glint {
    position:absolute; left:20%; top:14%; width:34%; height:22%; border-radius:50%;
    background:radial-gradient(ellipse, rgba(255,255,255,.5), transparent 70%);
    filter:blur(3px);
  }

  /* answer card */
  .answers { width:min(360px, 92vw); display:flex; flex-direction:column; gap:16px; }
  .qbox textarea {
    width:100%; min-height:60px; resize:none; background:rgba(60,40,60,.35);
    border:1px solid rgba(200,150,180,.28); border-radius:12px; color:#e8d0dc;
    font:inherit; font-style:italic; font-size:14.5px; padding:13px 16px; outline:none;
  }
  .qbox textarea:focus { border-color:rgba(230,170,200,.55); }
  .askbtn {
    background:linear-gradient(180deg, #8a4a6a, #6a2e4a); border:none; color:#f8e8f0;
    font-family:system-ui, sans-serif; font-weight:700; font-size:10px; letter-spacing:.32em;
    text-transform:uppercase; padding:14px 30px; border-radius:99px; cursor:pointer;
    box-shadow:0 8px 26px rgba(120,40,90,.4); transition:all .2s;
  }
  .askbtn:hover { transform:translateY(-2px); box-shadow:0 12px 34px rgba(140,50,100,.5); }
  .slip {
    background:#f4ecd8; color:#3a2c30; border-radius:4px; padding:18px 20px;
    font-size:15px; line-height:1.7; font-style:italic; position:relative;
    box-shadow:0 14px 36px rgba(0,0,0,.5);
    opacity:0; transform:translateY(12px) rotate(1.4deg); transition:all .7s cubic-bezier(.2,1.3,.4,1);
    max-height:0; overflow:hidden; padding:0 20px;
  }
  .slip.show { opacity:1; transform:rotate(-1deg); max-height:220px; padding:18px 20px; }
  .slip .seal {
    position:absolute; top:-14px; right:14px; width:38px; height:38px; border-radius:50%;
    background:radial-gradient(circle at 36% 30%, #c9452e, #7a1e14);
    color:#f4e6c8; display:flex; align-items:center; justify-content:center; font-size:15px;
    box-shadow:0 4px 10px rgba(0,0,0,.4), inset 0 0 0 3px rgba(244,230,200,.25);
    transform:rotate(-9deg);
  }
  .fan { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; min-height:34px; }
  .fan .old {
    font-size:11px; color:#a08890; border:1px solid rgba(160,136,144,.35);
    padding:6px 10px; border-radius:8px; max-width:100%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  @media (prefers-reduced-motion: reduce) { .ball .mist, .candle .flame { animation:none; } }
</style>
</head>
<body>
  <header>
    <h1>Oracle</h1>
    <p>ask a question · the glass will answer</p>
  </header>

  <div class="table">
    <div class="candles" aria-hidden="true">
      <div class="candle"><div class="flame"></div><div class="stick"></div></div>
      <div class="candle"><div class="flame"></div><div class="stick"></div></div>
      <div class="candle"><div class="flame"></div><div class="stick"></div></div>
    </div>

    <div class="ballwrap">
      <div class="ball" id="ball" role="button" tabindex="0" aria-label="ask the oracle">
        <div class="mist"></div>
        <div class="glint"></div>
      </div>
      <div class="stand"></div>
    </div>

    <div class="answers">
      <div class="qbox">
        <textarea id="qIn" maxlength="140" placeholder="type your question, or simply think it…"></textarea>
        <div style="text-align:center;margin-top:14px;">
          <button class="askbtn" id="askBtn">✦ consult the glass</button>
        </div>
      </div>
      <div class="slip" id="slip"><span class="seal">✦</span><span id="slipText"></span></div>
      <div class="fan" id="fan"></div>
    </div>
  </div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById($id(id));
  function $id(id) { return id; }
  const ANSWERS = [
    "the answer is yes, but not on a tuesday.",
    "you already know. you asked anyway. that is the answer.",
    "ask again when the moon is less amused.",
    "certainly — though 'certainly' is doing heavy lifting.",
    "no. and you will be grateful for it later.",
    "three roads. take the one with better coffee.",
    "the glass sees a letter. it is either M, W, or someone upside-down.",
    "it is already happening. look behind you. (do not actually look.)",
    "yes, if you stop asking strangers in glass balls.",
    "the stars say maybe. the candles say eat something.",
    "what you call a problem, the universe calls a tuesday.",
    "within a fortnight, or a decade. time is blobby here.",
    "the person you're thinking of is thinking of lunch, not you.",
    "absolutely — but read the fine print of your own heart first.",
    "the mist thickens. that traditionally means 'buy the ticket'.",
    "silence is also an answer. enjoy this one, it's free.",
    "yes. wear the other shoes.",
    "the glass is tired. the glass recommends sleep, water, and boldness.",
    "an unexpected kindness approaches. be unwisely receptive.",
    "in the end, it will have been about the friends you annotated.",
  ];

  const ball = $("ball"), slip = $("slip");
  let busy = false;
  const history = [];

  function consult() {
    if (busy) return;
    busy = true;
    ball.classList.add("charging");
    /* rising hum */
    hum();
    /* mist thickens */
    ball.querySelector(".mist").style.filter = "blur(9px)";
    ball.querySelector(".mist").style.opacity = "1";
    setTimeout(() => {
      const ans = ANSWERS[Math.floor(Math.random() * ANSWERS.length)];
      $("slipText").textContent = "“" + ans + "”";
      slip.classList.add("show");
      history.unshift(ans);
      if (history.length > 8) history.pop();
      $("fan").innerHTML = "";
      history.forEach(h => {
        const d = document.createElement("span");
        d.className = "old";
        d.textContent = h;
        d.title = h;
        $("fan").appendChild(d);
      });
      ball.classList.remove("charging");
      ball.querySelector(".mist").style.filter = "blur(16px)";
      ball.querySelector(".mist").style.opacity = ".85";
      chime();
      busy = false;
    }, 2200);
  }

  $("askBtn").addEventListener("click", consult);
  ball.addEventListener("click", consult);
  ball.addEventListener("keydown", (e) => { if (e.key === "Enter") consult(); });

  /* ---------- audio ---------- */
  let AC = null;
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
    if (AC && AC.state === "suspended") AC.resume().catch(() => {});
    return AC;
  }
  function hum() {
    const c = ac(); if (!c) return;
    try {
      const t0 = c.currentTime;
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(70, t0);
      o.frequency.linearRampToValueAtTime(190, t0 + 2);
      const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 380;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.03, t0 + 0.8);
      g.gain.linearRampToValueAtTime(0.0001, t0 + 2.2);
      o.connect(f); f.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + 2.3);
    } catch (e) {}
  }
  function chime() {
    const c = ac(); if (!c) return;
    try {
      const t0 = c.currentTime;
      [523.25, 659.25, 987.77].forEach((f, i) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.04 / (i + 1), t0 + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.6);
        o.connect(g); g.connect(c.destination);
        o.start(t0); o.stop(t0 + 1.7);
      });
    } catch (e) {}
  }
})();
</script>
</body>
</html>
