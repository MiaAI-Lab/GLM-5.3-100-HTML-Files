<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLOWWORKS — neon sign workshop</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#0c0c11; color:#e8e8f0; overflow:hidden;
    font-family: system-ui, -apple-system, sans-serif;
  }
  /* ---------- brick wall ---------- */
  .wall {
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(70,60,110,.22), transparent 60%),
      repeating-linear-gradient(0deg, #16151c 0 34px, #1c1b24 34px 36px),
      repeating-linear-gradient(90deg, transparent 0 74px, #0c0c11 74px 78px),
      #16151c;
  }
  .wall::after {
    content:""; position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(0,0,0,.72) 95%);
    pointer-events:none;
  }
  /* mortar roughness */
  .wall::before {
    content:""; position:absolute; inset:0; opacity:.5;
    background-image:
      radial-gradient(rgba(255,255,255,.03) 1px, transparent 1.6px),
      radial-gradient(rgba(0,0,0,.14) 1px, transparent 1.6px);
    background-size: 9px 9px, 13px 13px;
  }
  .spill {
    position:fixed; inset:0; pointer-events:none; z-index:1;
    background:radial-gradient(ellipse 60% 46% at 50% 44%, var(--glow, rgba(255,60,160,.20)), transparent 70%);
    transition:background .5s;
  }
  /* ---------- sign ---------- */
  .signboard {
    position:fixed; left:50%; top:44%; transform:translate(-50%,-50%) rotate(-1.6deg);
    padding:56px 64px; border-radius:14px; z-index:3;
    background:rgba(10,10,14,.35);
    border:1px solid rgba(255,255,255,.07);
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    min-width:min(560px, 88vw);
  }
  .mount { position:absolute; width:8px; height:26px; background:#2a2a33; border-radius:3px; top:-22px; }
  .mount.l { left:18%; } .mount.r { right:18%; }
  .mount::before { content:""; position:absolute; top:-8px; left:-3px; width:14px; height:8px; background:#3a3a44; border-radius:2px; }

  #signText {
    font-family:"Trebuchet MS", Verdana, system-ui, sans-serif;
    font-size:clamp(44px, 11vw, 110px);
    font-weight:700; letter-spacing:.06em; line-height:1.06;
    text-align:center; white-space:nowrap;
    color:var(--neon, #ff44aa);
    text-shadow:
      0 0 6px var(--neon, #ff44aa),
      0 0 18px var(--neon, #ff44aa),
      0 0 42px var(--neon, #ff44aa),
      0 0 90px var(--neon, #ff44aa);
    transition:color .4s, text-shadow .4s;
  }
  #signText .ch { display:inline-block; position:relative; }
  #signText .ch.flip { animation:flipIn .5s cubic-bezier(.2,1.5,.4,1); }
  @keyframes flipIn {
    0% { opacity:0; transform:translateY(-26px) rotateX(90deg) scale(1.3); filter:blur(4px); }
    100% { opacity:1; transform:none; filter:none; }
  }
  #signText .ch.dying {
    animation:dying 2.8s infinite;
  }
  @keyframes dying {
    0%,54%,58%,100% { opacity:1; }
    55%,57% { opacity:.18; }
    78% { opacity:1; } 79% { opacity:.3; } 80% { opacity:1; }
  }
  .backboard {
    position:absolute; inset:14px; border:2px dashed rgba(255,255,255,.05); border-radius:10px;
    pointer-events:none;
  }
  /* transformer hum box */
  .transformer {
    position:fixed; left:26px; bottom:88px; z-index:4; width:92px; padding:10px 8px;
    background:#14141b; border:1px solid #26262f; border-radius:10px;
    font-size:8px; letter-spacing:.18em; color:#6a6a78; text-transform:uppercase; text-align:center;
  }
  .transformer i { display:block; width:100%; height:3px; margin-top:6px; background:#22222b; border-radius:2px; overflow:hidden; position:relative; }
  .transformer i b { position:absolute; inset:0; transform-origin:left; background:var(--neon,#ff44aa); opacity:.8; transform:scaleX(.7); }
  /* ---------- workbench UI ---------- */
  .bench {
    position:fixed; left:50%; bottom:0; transform:translateX(-50%);
    width:min(760px, 96vw); z-index:5;
    background:rgba(16,16,22,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.09); border-bottom:none;
    border-radius:18px 18px 0 0; padding:16px 20px 14px;
    display:flex; flex-direction:column; gap:12px;
    box-shadow:0 -18px 50px rgba(0,0,0,.5);
  }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .row label { font-size:9px; letter-spacing:.24em; color:#8a8a9a; text-transform:uppercase; white-space:nowrap; }
  input[type=text] {
    flex:1; min-width:120px; background:#0e0e14; border:1px solid #2b2b36; color:#f2f2f8;
    font:inherit; font-size:16px; padding:10px 14px; border-radius:9px; outline:none; letter-spacing:.08em;
  }
  input[type=text]:focus { border-color:var(--neon,#ff44aa); box-shadow:0 0 0 3px rgba(255,68,170,.15); }
  .swatchrow { display:flex; gap:8px; }
  .sw {
    width:38px; height:38px; border-radius:50%; border:2px solid transparent; cursor:pointer;
    transition:transform .15s, border-color .15s; position:relative;
  }
  .sw:hover { transform:scale(1.14); }
  .sw.on { border-color:#fff; transform:scale(1.14); box-shadow:0 0 14px var(--c); }
  .btn {
    background:#1d1d27; color:#dcdce8; border:1px solid #33333f; border-radius:9px;
    font:inherit; font-size:10px; letter-spacing:.18em; text-transform:uppercase;
    padding:10px 16px; cursor:pointer; transition:all .15s;
  }
  .btn:hover { background:#282835; border-color:#4a4a5a; }
  .btn.warn { border-color:#5a2a35; color:#ff9d9d; }
  .btn.warn:hover { background:#2d1a20; }
  .sliderrow { display:flex; align-items:center; gap:10px; flex:1; min-width:180px; }
  .sliderrow output { font-size:10px; color:#a8a8b8; width:34px; text-align:right; font-variant-numeric:tabular-nums; }
  input[type=range] {
    -webkit-appearance:none; appearance:none; flex:1; height:3px; border-radius:99px;
    background:#2b2b36; outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appliance:none; -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--neon,#ff44aa); box-shadow:0 0 10px var(--neon,#ff44aa); cursor:grab;
  }
  input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:var(--neon,#ff44aa); border:none; box-shadow:0 0 10px var(--neon,#ff44aa); }
  .flash {
    position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:60;
  }
  .flash.go { animation:flashgo .5s ease-out; }
  @keyframes flashgo { 0% { opacity:.95; } 100% { opacity:0; } }
  .polaroid {
    position:fixed; right:30px; top:26px; z-index:30; padding:12px 12px 40px;
    background:#f4f1e8; border-radius:4px; box-shadow:0 18px 50px rgba(0,0,0,.65);
    transform:rotate(4deg) scale(.6); opacity:0; pointer-events:none;
    transition:transform .45s cubic-bezier(.2,1.4,.4,1), opacity .3s;
  }
  .polaroid.show { transform:rotate(4deg) scale(1); opacity:1; }
  .polaroid .ph { width:220px; height:150px; background:#0c0c11; border-radius:2px; position:relative; overflow:hidden; }
  .polaroid .ph .mini {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:30px; letter-spacing:.05em; color:var(--neon,#ff44aa);
    text-shadow:0 0 10px var(--neon,#ff44aa), 0 0 28px var(--neon,#ff44aa);
  }
  .polaroid .cap { position:absolute; bottom:12px; left:0; right:0; text-align:center;
    font-size:11px; color:#5a5648; font-family:Georgia, serif; font-style:italic; }
  .toast {
    position:fixed; top:20px; left:50%; transform:translate(-50%,-80px); z-index:70;
    background:#1d1d27; border:1px solid #33333f; color:#e8e8f2; border-radius:999px;
    padding:9px 18px; font-size:11px; letter-spacing:.14em;
    transition:transform .35s cubic-bezier(.2,1.4,.4,1);
  }
  .toast.show { transform:translate(-50%,0); }
  @media (max-width:640px) {
    .signboard { padding:40px 28px; top:38%; }
    .transformer { display:none; }
    .bench { padding:12px 12px 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #signText .ch.flip, #signText .ch.dying { animation:none; }
  }
</style>
</head>
<body>
  <div class="wall"></div>
  <div class="spill" id="spill"></div>

  <div class="signboard">
    <span class="mount l"></span><span class="mount r"></span>
    <div class="backboard"></div>
    <div id="signText" aria-live="polite">OPEN</div>
  </div>

  <div class="transformer">
    transformer
    <i><b id="loadBar"></b></i>
    <span id="watts">700mA</span>
  </div>

  <div class="bench">
    <div class="row">
      <label for="signInput">bend text</label>
      <input type="text" id="signInput" maxlength="14" value="OPEN" autocomplete="off" spellcheck="false">
    </div>
    <div class="row">
      <label>gas</label>
      <div class="swatchrow" id="gases">
        <button class="sw on" data-c="#ff44aa" style="--c:#ff44aa; background:radial-gradient(circle at 35% 30%, #ffa1d2, #ff44aa 60%, #b31f6e)" aria-label="hot pink"></button>
        <button class="sw" data-c="#33e0ff" style="--c:#33e0ff; background:radial-gradient(circle at 35% 30%, #b2f2ff, #33e0ff 60%, #147d99)" aria-label="electric cyan"></button>
        <button class="sw" data-c="#7dff5e" style="--c:#7dff5e; background:radial-gradient(circle at 35% 30%, #d2ffc4, #7dff5e 60%, #2e9922)" aria-label="lime"></button>
        <button class="sw" data-c="#ffb347" style="--c:#ffb347; background:radial-gradient(circle at 35% 30%, #ffe4b8, #ffb347 60%, #b3741f)" aria-label="amber"></button>
      </div>
      <div class="sliderrow">
        <label for="intensity">intensity</label>
        <input type="range" id="intensity" min="20" max="100" value="72">
        <output id="intensityOut">72</output>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="flickerBtn">flicker test</button>
      <button class="btn" id="photoBtn">photo mode</button>
      <button class="btn" id="soundBtn">sound: off</button>
      <button class="btn warn" id="killBtn">cut power</button>
    </div>
  </div>

  <div class="polaroid" id="polaroid">
    <div class="ph"><div class="mini" id="miniSign">OPEN</div></div>
    <div class="cap">glowworks · hand-bent, 12mm electrode</div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const signText = $("signText");
  const signInput = $("signInput");
  let neon = "#ff44aa", intensity = 72, powered = true, soundOn = false;
  let audio = null, humGain = null, humOsc = null;

  /* ---------- letter build ---------- */
  function buildSign(str) {
    signText.textContent = "";
    [...str].forEach((ch, i) => {
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = ch === " " ? "\u00A0" : ch;
      s.style.animationDelay = (i * 0.07) + "s";
      signText.appendChild(s);
      if (i > 0 && Math.random() < 0.16) setTimeout(() => s.classList.add("dying"), 2600 + Math.random() * 4000);
    });
    styleSign();
  }
  function styleSign() {
    const k = intensity / 100;
    signText.style.setProperty("--neon", neon);
    document.documentElement.style.setProperty("--neon", neon);
    const layers = powered ? [
      "0 0 " + (6 * k) + "px " + neon,
      "0 0 " + (18 * k) + "px " + neon,
      "0 0 " + (42 * k) + "px " + neon,
      "0 0 " + (90 * k) + "px " + neon,
    ].join(", ") : "none";
    signText.style.textShadow = layers;
    signText.style.color = powered ? neon : "#26262e";
    const spill = $("spill");
    spill.style.setProperty("--glow", powered ? hexA(neon, 0.10 + 0.16 * k) : "rgba(0,0,0,0)");
    $("loadBar").style.transform = "scaleX(" + (powered ? 0.3 + 0.7 * k : 0) + ")";
    $("watts").textContent = powered ? Math.round(300 + 700 * k) + "mA" : "0mA";
    $("miniSign").textContent = signInput.value || "OPEN";
    $("miniSign").style.color = neon;
    $("miniSign").style.textShadow = "0 0 10px " + neon + ", 0 0 28px " + neon;
  }
  function hexA(hex, a) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return "rgba(" + r + "," + g + "," + b + "," + a + ")";
  }

  /* ---------- input ---------- */
  signInput.addEventListener("input", () => {
    const v = (signInput.value || " ").toUpperCase();
    buildSign(v === " " ? "\u00A0" : v);
    styleSign();
    if (soundOn) spark();
  });

  /* gas swatches */
  $("gases").querySelectorAll(".sw").forEach(b => {
    b.addEventListener("click", () => {
      $("gases").querySelectorAll(".sw").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      neon = b.dataset.c;
      styleSign();
      if (soundOn) spark();
      toastMsg("gas swapped · " + b.getAttribute("aria-label"));
    });
  });

  /* intensity */
  $("intensity").addEventListener("input", (e) => {
    intensity = parseInt(e.target.value, 10);
    $("intensityOut").textContent = intensity;
    styleSign();
    if (audio && humGain) {
      try { humGain.gain.setTargetAtTime(soundOn && powered ? 0.012 + intensity / 100 * 0.03 : 0, audio.currentTime, 0.1); } catch (err) {}
    }
  });

  /* ---------- audio (gesture-gated) ---------- */
  function ensureAudio() {
    if (audio) return audio;
    try {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      humGain = audio.createGain(); humGain.gain.value = 0; humGain.connect(audio.destination);
      humOsc = audio.createOscillator(); humOsc.type = "sawtooth"; humOsc.frequency.value = 110;
      const humFilter = audio.createBiquadFilter(); humFilter.type = "lowpass"; humFilter.frequency.value = 320;
      humOsc.connect(humFilter); humFilter.connect(humGain); humOsc.start();
    } catch (e) { audio = null; }
    return audio;
  }
  function spark() {
    const c = ensureAudio(); if (!c || !soundOn) return;
    try {
      const o = c.createOscillator(), gn = c.createGain();
      o.type = "square"; o.frequency.value = 1600 + Math.random() * 900;
      gn.gain.setValueAtTime(0.03, c.currentTime);
      gn.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.09);
      o.connect(gn); gn.connect(c.destination);
      o.start(); o.stop(c.currentTime + 0.1);
    } catch (e) {}
  }
  $("soundBtn").addEventListener("click", () => {
    soundOn = !soundOn;
    $("soundBtn").textContent = "sound: " + (soundOn ? "on" : "off");
    if (soundOn) {
      ensureAudio();
      if (audio && audio.state === "suspended") audio.resume().catch(() => {});
      if (humGain) try { humGain.gain.setTargetAtTime(powered ? 0.012 + intensity / 100 * 0.03 : 0, audio.currentTime, 0.2); } catch (e) {}
      spark();
    } else if (humGain) {
      try { humGain.gain.setTargetAtTime(0, audio.currentTime, 0.1); } catch (e) {}
    }
  });

  /* ---------- flicker test ---------- */
  $("flickerBtn").addEventListener("click", () => {
    if (!powered) { toastMsg("power is cut"); return; }
    const chs = signText.querySelectorAll(".ch");
    let burst = 0;
    const iv = setInterval(() => {
      burst++;
      chs.forEach(ch => {
        if (Math.random() < 0.4) {
          ch.style.opacity = Math.random() < 0.5 ? 0.15 : 1;
        }
      });
      if (soundOn && Math.random() < 0.5) spark();
      if (burst > 14) {
        clearInterval(iv);
        chs.forEach(ch => { ch.style.opacity = 1; });
      }
    }, 90);
    toastMsg("flicker test · tubes nominal(ish)");
  });

  /* ---------- photo mode ---------- */
  $("photoBtn").addEventListener("click", () => {
    $("flash").classList.remove("go"); void $("flash").offsetWidth;
    $("flash").classList.add("go");
    if (soundOn) spark();
    setTimeout(() => $("polaroid").classList.add("show"), 160);
    setTimeout(() => $("polaroid").classList.remove("show"), 3600);
    toastMsg("say cheese · f/2.8 · 1/60");
  });

  /* ---------- power cut ---------- */
  $("killBtn").addEventListener("click", () => {
    powered = !powered;
    $("killBtn").textContent = powered ? "cut power" : "restore power";
    styleSign();
    if (humGain && audio) {
      try { humGain.gain.setTargetAtTime(powered && soundOn ? 0.03 : 0, audio.currentTime, 0.08); } catch (e) {}
    }
    toastMsg(powered ? "power restored" : "power cut · dark studio");
  });

  /* ---------- toast ---------- */
  let toastTimer = null;
  function toastMsg(m) {
    const t = $("toast");
    t.textContent = m;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1700);
  }

  buildSign("OPEN");
})();
</script>
</body>
</html>
