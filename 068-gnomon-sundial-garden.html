<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GNOMON — the sundial garden</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family: Georgia, "Palatino Linotype", serif;
    color:#4a3a28; touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #garden { position:fixed; inset:0; }
  canvas#c { position:absolute; inset:0; width:100%; height:100%; }

  .hud {
    position:fixed; left:22px; top:18px; z-index:10;
  }
  .hud h1 { font-size:17px; font-weight:400; letter-spacing:.5em; text-transform:uppercase; color:#5a4a32; }
  .hud p { font-family:system-ui, sans-serif; font-size:9px; letter-spacing:.28em; color:#a08c6a; text-transform:uppercase; margin-top:5px; }

  .panel {
    position:fixed; right:18px; top:16px; z-index:10; width:230px;
    background:rgba(246,238,222,.85); border:1px solid rgba(90,74,50,.28); border-radius:14px;
    padding:14px 16px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    display:flex; flex-direction:column; gap:12px;
  }
  .panel .lab { font-family:system-ui, sans-serif; font-size:8.5px; letter-spacing:.26em; color:#a08c6a; text-transform:uppercase; }
  .panel .readout { font-family:"Courier New", monospace; font-size:13px; color:#5a4a32; line-height:1.8; }
  .panel .readout b { font-size:17px; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:3px; background:#c9b896; border-radius:99px; outline:none; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:#f6eee0; border:2px solid #8a6e44; }
  .panel .btns { display:flex; gap:8px; }
  .panel .btns button {
    flex:1; background:rgba(90,74,50,.08); color:#5a4a32; border:1px solid rgba(90,74,50,.3);
    font-family:system-ui, sans-serif; font-size:8.5px; letter-spacing:.16em; text-transform:uppercase;
    padding:8px 6px; border-radius:8px; cursor:pointer; transition:all .15s;
  }
  .panel .btns button:hover { background:rgba(90,74,50,.2); }
  .panel .btns button.on { background:#8a6e44; color:#f6eee0; border-color:#8a6e44; }
  .panel .note { font-size:10px; font-style:italic; color:#8a7a5e; line-height:1.6; }

  .hintline { position:fixed; left:22px; bottom:16px; z-index:10; font-family:system-ui, sans-serif;
    font-size:9px; letter-spacing:.24em; color:#a08c6a; text-transform:uppercase; }
  @media (max-width:640px) { .hintline { display:none; } .panel { width:200px; } }
</style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="hud">
    <h1>Gnomon</h1>
    <p>a garden sundial · drag the sun</p>
  </div>

  <div class="panel">
    <span class="lab">solar time</span>
    <div class="readout"><b id="timeV">12:00</b><br><span id="shadowV">shadow 0.0×</span></div>
    <span class="lab">hour angle</span>
    <input type="range" id="sunR" min="0" max="100" value="50" aria-label="sun position">
    <span class="lab">season</span>
    <input type="range" id="seasonR" min="0" max="100" value="50" aria-label="season">
    <div class="btns">
      <button id="realBtn">real time</button>
      <button id="dayBtn">run a day</button>
    </div>
    <p class="note" id="noteV">the shadow shortens toward noon and lengthens with the seasons, as it has since 1500 bce.</p>
  </div>
  <div class="hintline">equation of time: −3 min · solstice dec 21</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById($id(id));
  function $id(id) { return id; }
  const cv = $("c"), g = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  let hour = 12;        /* 0..24 solar time */
  let season = 0.5;     /* 0 winter solstice .. 1 summer */
  let mode = "manual";  /* manual | real | day */

  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  /* ---------- geometry ---------- */
  function dialCenter() { return { x: W * 0.5, y: H * 0.56, r: Math.min(W, H) * 0.3 }; }
  /* sun altitude proxy: sine of hour angle, scaled by season */
  function sunAlt() {
    const ha = (hour - 12) / 12 * Math.PI;   /* hour angle −π..π */
    const maxAlt = 0.45 + season * 0.55;     /* season factor */
    return Math.sin(Math.max(0, Math.cos(ha)) * 1.2) * maxAlt;
  }
  function shadowLen() {
    /* gnomon shadow length ∝ 1/tan(alt) */
    const alt = Math.max(0.03, sunAlt());
    return Math.min(3.2, 0.35 / Math.tan(alt * 1.35));
  }
  function shadowAngle() {
    /* shadow swings from west (morning) to east (evening) */
    return Math.PI + (hour - 12) / 6 * Math.PI * 0.5;
  }

  /* ---------- sky grade by hour + season ---------- */
  function skyStops() {
    const h = hour;
    if (h < 5.5 || h > 20) return ["#141a2e", "#1e2438", "#2a2c3e"];
    if (h < 7.5) { const k = (h - 5.5) / 2; return blend(["#2a2c48", "#5a4a58", "#8a6a5a"], ["#e8c8a0", "#f0d8b0", "#c9a882"], k); }
    if (h > 18) { const k = (h - 18) / 2.5; return blend(["#f0d0a0", "#e8b088", "#c98868"], ["#2a2c48", "#3a3450", "#463e54"], k); }
    const warm = 1 - season * 0.5;
    return blend(["#cfe0ea", "#e8ecda", "#d8d4b8"], ["#a8c8dc", "#d8e4c8", "#c9c8a0"], season) ;
  }
  function blend(a, b, t) {
    return a.map((ca, i) => {
      const pa = hexRGB(ca), pb = hexRGB(b[i]);
      return "rgb(" + Math.round(pa[0] + (pb[0] - pa[0]) * t) + "," + Math.round(pa[1] + (pb[1] - pa[1]) * t) + "," + Math.round(pa[2] + (pb[2] - pa[2]) * t) + ")";
    });
  }
  function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }

  /* ---------- render ---------- */
  function draw() {
    const stops = skyStops();
    const sky = g.createLinearGradient(0, 0, 0, H * 0.7);
    sky.addColorStop(0, stops[0]); sky.addColorStop(0.6, stops[1]); sky.addColorStop(1, stops[2]);
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);

    /* sun */
    const ha = (hour - 12) / 12 * Math.PI;
    const sunX = W * 0.5 - Math.sin(ha) * W * 0.42;
    const sunY = H * 0.42 - Math.cos(ha) * H * 0.34 * (0.5 + season * 0.5);
    if (hour > 5.5 && hour < 19.5) {
      const rg = g.createRadialGradient(sunX, sunY, 4, sunX, sunY, 90);
      rg.addColorStop(0, "rgba(255,246,214,.95)");
      rg.addColorStop(0.25, "rgba(255,236,180,.55)");
      rg.addColorStop(1, "rgba(255,230,170,0)");
      g.fillStyle = rg;
      g.beginPath(); g.arc(sunX, sunY, 90, 0, 6.283); g.fill();
      g.fillStyle = "#fff8dc";
      g.beginPath(); g.arc(sunX, sunY, 16, 0, 6.283); g.fill();
    } else {
      /* stars at night */
      g.fillStyle = "rgba(240,240,250,.8)";
      for (let i = 0; i < 60; i++) {
        g.fillRect((i * 149) % W, (i * 83) % (H * 0.5), 1.4, 1.4);
      }
      /* moon */
      const mx = W * 0.76, my = H * 0.2;
      g.fillStyle = "#e8e8f0";
      g.beginPath(); g.arc(mx, my, 13, 0, 6.283); g.fill();
      g.fillStyle = stops[0];
      g.beginPath(); g.arc(mx + 5, my - 3, 11, 0, 6.283); g.fill();
    }

    /* courtyard ground: travertine */
    const ground = g.createLinearGradient(0, H * 0.52, 0, H);
    ground.addColorStop(0, "#e2d2ae");
    ground.addColorStop(1, "#c9b488");
    g.fillStyle = ground;
    g.fillRect(0, H * 0.52, W, H * 0.48);
    /* paving joints */
    g.strokeStyle = "rgba(120,100,70,.25)";
    g.lineWidth = 1;
    for (let x = 0; x < W; x += 64) { g.beginPath(); g.moveTo(x, H * 0.52); g.lineTo(x, H); g.stroke(); }
    for (let y = H * 0.52; y < H; y += 44) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }

    /* cypress silhouettes */
    [[0.08, 1], [0.92, 0.85]].forEach(([fx, s]) => {
      g.fillStyle = "rgba(60,82,60,.85)";
      const cx = W * fx, base = H * 0.52;
      g.beginPath();
      g.moveTo(cx, base);
      g.quadraticCurveTo(cx - 30 * s, base - 120 * s, cx, base - 220 * s);
      g.quadraticCurveTo(cx + 30 * s, base - 120 * s, cx, base);
      g.fill();
    });

    /* the sundial plinth */
    const D = dialCenter();
    /* plinth column */
    g.fillStyle = "#d8c8a4";
    g.beginPath();
    g.ellipse(D.x, D.y + 30, 64, 22, 0, 0, 6.283);
    g.fill();
    g.fillStyle = "#c9b48c";
    g.fillRect(D.x - 46, D.y - 46, 92, 74);
    /* dial plate */
    g.fillStyle = "#e8dcc0";
    g.beginPath();
    g.ellipse(D.x, D.y - 46, 78, 30, 0, 0, 6.283);
    g.fill();
    g.strokeStyle = "#8a744e"; g.lineWidth = 2;
    g.beginPath(); g.ellipse(D.x, D.y - 46, 78, 30, 0, 0, 6.283); g.stroke();

    /* hour lines + roman numerals (elliptical projection) */
    g.strokeStyle = "rgba(90,74,50,.55)";
    g.lineWidth = 1.4;
    g.fillStyle = "#6a543a";
    g.font = "11px Georgia";
    g.textAlign = "center";
    const ROMAN = ["VI", "VII", "VIII", "IX", "X", "XI", "XII", "I", "II", "III", "IV", "V", "VI"];
    for (let i = 0; i <= 12; i++) {
      const a = -Math.PI / 2 + (i / 12) * Math.PI * 1.7 - Math.PI * 0.35;
      const hx = D.x + Math.cos(a) * 74;
      const hy = D.y - 46 + Math.sin(a) * 27;
      g.beginPath();
      g.moveTo(D.x, D.y - 46);
      g.lineTo(hx, hy);
      g.stroke();
      const nx = D.x + Math.cos(a) * 92;
      const ny = D.y - 46 + Math.sin(a) * 34;
      g.fillText(ROMAN[i], nx, ny + 4);
    }

    /* gnomon (triangular) */
    g.fillStyle = "#8a744e";
    g.beginPath();
    g.moveTo(D.x - 10, D.y - 44);
    g.lineTo(D.x + 10, D.y - 44);
    g.lineTo(D.x + 2, D.y - 104);
    g.closePath();
    g.fill();
    g.strokeStyle = "#6a543a";
    g.stroke();

    /* shadow */
    const sl = shadowLen() * 84;
    const sa = shadowAngle();
    const night = hour <= 6 || hour >= 18;
    g.save();
    g.globalAlpha = night ? 0.15 : 0.34;
    g.fillStyle = "#3a2c1a";
    g.beginPath();
    g.moveTo(D.x - 8, D.y - 44);
    g.lineTo(D.x + 8, D.y - 44);
    const ex = D.x + Math.cos(sa) * sl * 2.2;
    const ey = D.y - 44 + Math.abs(Math.sin(sa)) * sl * 0.7;
    g.lineTo(ex + 6, ey);
    g.lineTo(ex - 6, ey);
    g.closePath();
    g.fill();
    g.restore();

    /* readouts */
    const hh = Math.floor(hour), mm = Math.floor((hour % 1) * 60);
    $("timeV").textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
    $("shadowV").textContent = "shadow " + shadowLen().toFixed(1) + "× gnomon";
  }

  /* ---------- modes ---------- */
  $("sunR").addEventListener("input", (e) => {
    mode = "manual";
    hour = 5.5 + (parseInt(e.target.value, 10) / 100) * 14;
  });
  $("seasonR").addEventListener("input", (e) => {
    season = parseInt(e.target.value, 10) / 100;
    $("noteV").textContent = season < 0.25 ? "winter: long shadows, low sun." : season > 0.75 ? "summer: the noon shadow nearly vanishes." : "equinox: day and night weigh the same.";
  });
  $("realBtn").addEventListener("click", function () {
    mode = "real";
    this.classList.add("on");
    $("dayBtn").classList.remove("on");
  });
  let daySpeed = 1 / 30;
  $("dayBtn").addEventListener("click", function () {
    mode = mode === "day" ? "manual" : "day";
    this.classList.toggle("on", mode === "day");
    $("realBtn").classList.remove("on");
  });

  /* loop */
  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(50, now - last); last = now;
    if (document.hidden) return;
    if (mode === "day") {
      hour = (hour + dt / 1000 * (24 / 60)) % 24; /* day in 60s */
      $("sunR").value = Math.round(((hour - 5.5) / 14) * 100);
    } else if (mode === "real") {
      const d = new Date();
      hour = d.getHours() + d.getMinutes() / 60;
      $("sunR").value = Math.round(((hour - 5.5) / 14) * 100);
    }
    draw();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
