<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBA — balloon festival at dawn</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { font-family: system-ui, -apple-system, sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  #scene { position:fixed; inset:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }

  .hud {
    position:fixed; left:20px; top:18px; z-index:10; color:#6a5560;
  }
  .hud h1 { font-size:17px; font-weight:300; letter-spacing:.5em; text-transform:uppercase; }
  .hud p { font-size:9px; letter-spacing:.26em; text-transform:uppercase; margin-top:5px; color:#967f8a; }

  .rail {
    position:fixed; right:20px; top:50%; transform:translateY(-50%); z-index:10;
    display:flex; flex-direction:column; gap:10px;
  }
  .rail button {
    width:46px; height:46px; border-radius:50%; border:1px solid rgba(120,90,100,.4);
    background:rgba(255,246,240,.55); color:#7a5f6a; font:inherit; font-size:9px; letter-spacing:.08em;
    text-transform:uppercase; cursor:pointer; transition:all .18s; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  }
  .rail button:hover { background:rgba(255,246,240,.9); transform:scale(1.08); }
  .rail button.on { background:#e8a490; color:#fff; border-color:#e8a490; }
  .rail .sunlab { text-align:center; font-size:8px; letter-spacing:.2em; color:#967f8a; text-transform:uppercase; margin-top:4px; }

  .suntrack {
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:10;
    width:min(400px, 84vw); padding:12px 20px; border-radius:999px;
    background:rgba(255,246,240,.6); border:1px solid rgba(120,90,100,.28);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    display:flex; align-items:center; gap:14px;
  }
  .suntrack .lab { font-size:8.5px; letter-spacing:.22em; color:#967f8a; text-transform:uppercase; white-space:nowrap; }
  input[type=range] {
    -webkit-appearance:none; appearance:none; flex:1; height:3px; border-radius:99px;
    background:linear-gradient(90deg, #b06a7e, #e8a490, #ffd9a0); outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#fff; border:2px solid #e8a490; box-shadow:0 0 8px rgba(232,164,144,.8); }
  .statusline { font-size:9px; letter-spacing:.2em; color:#967f8a; text-transform:uppercase; white-space:nowrap; }

  @media (max-width:640px) {
    .rail { right:10px; }
    .rail button { width:38px; height:38px; }
  }
</style>
</head>
<body>
  <div id="scene"><canvas id="c"></canvas></div>

  <div class="hud">
    <h1>Alba</h1>
    <p>dawn launch · mist valley · drift gentle</p>
  </div>

  <div class="rail">
    <button id="regattaBtn">all<br>up</button>
    <button id="burnBtn">burn</button>
    <div class="sunlab">gust</div>
    <button id="gustBtn">≫</button>
  </div>

  <div class="suntrack">
    <span class="lab">sun</span>
    <input type="range" id="sunR" min="0" max="100" value="18" aria-label="sun position">
    <span class="statusline" id="statusL">first light</span>
  </div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const cv = $("c"), g = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  let sun = 0.18, wind = 0.35, gust = 0;

  /* ---------- balloons ---------- */
  const PATTERNS = ["stripes", "dots", "chevron", "panels"];
  const HUES = [
    ["#e86a5a", "#f4a259", "#ffd9a0"], ["#5aa9d6", "#7cc6e8", "#dff0f8"],
    ["#e8a4c8", "#c980a8", "#f4d4e4"], ["#7db86a", "#a8d68f", "#e2f2d8"],
    ["#e8c14a", "#f4d47c", "#fdf0c8"], ["#8a6ae8", "#ab8ff0", "#ddd0f8"],
  ];
  const balloons = [];
  function makeBalloon(i) {
    const pat = PATTERNS[i % PATTERNS.length];
    const hue = HUES[(i * 2 + 1) % HUES.length];
    return {
      x: 0.1 + Math.random() * 0.8,
      alt: 0.12 + Math.random() * 0.5,          /* 0 ground .. 1 top */
      targetAlt: 0.3 + Math.random() * 0.4,
      size: 34 + Math.random() * 30,
      pat, hue,
      sway: Math.random() * 6.28,
      burner: 0,
      grounded: Math.random() < 0.4,
      name: ["aurelia", "kesär", "marlowe", "pip", "vesper", "old gold", "lumen", "juniper"][i % 8],
    };
  }
  for (let i = 0; i < 8; i++) balloons.push(makeBalloon(i));

  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  /* ---------- audio ---------- */
  let AC = null;
  function whoosh() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
    if (!AC) return;
    try {
      if (AC.state === "suspended") AC.resume().catch(() => {});
      const t0 = AC.currentTime;
      const buf = AC.createBuffer(1, AC.sampleRate * 0.9, AC.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      const src = AC.createBufferSource(); src.buffer = buf;
      const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 700;
      const gn = AC.createGain(); gn.gain.value = 0.09;
      src.connect(f); f.connect(gn); gn.connect(AC.destination);
      src.start(t0);
    } catch (e) {}
  }

  /* ---------- palette by sun ---------- */
  function skyColors() {
    /* night → dawn → morning */
    if (sun < 0.25) {
      const k = sun / 0.25;
      return lerpCol(["#1a1e3a", "#2a2440", "#3a2e48"], ["#4a3a5e", "#8a5a6a", "#c98474"], k);
    }
    if (sun < 0.6) {
      const k = (sun - 0.25) / 0.35;
      return lerpCol(["#4a3a5e", "#8a5a6a", "#c98474"], ["#f0b890", "#f8d0a8", "#fde8cc"], k);
    }
    const k = (sun - 0.6) / 0.4;
    return lerpCol(["#f0b890", "#f8d0a8", "#fde8cc"], ["#a8d0e8", "#cfe4f0", "#f2f6f0"], k);
  }
  function lerpCol(a, b, t) {
    return a.map((ca, i) => {
      const pa = hexRGB(ca), pb = hexRGB(b[i]);
      return "rgb(" + Math.round(pa[0] + (pb[0] - pa[0]) * t) + "," +
        Math.round(pa[1] + (pb[1] - pa[1]) * t) + "," +
        Math.round(pa[2] + (pb[2] - pa[2]) * t) + ")";
    });
  }
  function hexRGB(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }

  /* ---------- scene paint ---------- */
  let t = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (document.hidden) return;
    t = now;
    gust *= 0.985;
    const drift = (wind + gust) * 0.00004;

    /* sky */
    const cols = skyColors();
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, cols[0]); sky.addColorStop(0.55, cols[1]); sky.addColorStop(1, cols[2]);
    g.fillStyle = sky; g.fillRect(0, 0, W, H);

    /* sun glow */
    const sx = W * (0.15 + sun * 0.7), sy = H * (0.75 - sun * 0.62);
    const sr = 40 + sun * 30;
    const halo = g.createRadialGradient(sx, sy, 4, sx, sy, W * 0.5);
    halo.addColorStop(0, "rgba(255,236,190," + (0.5 + sun * 0.4) + ")");
    halo.addColorStop(0.15, "rgba(255,210,150,.35)");
    halo.addColorStop(1, "rgba(255,200,140,0)");
    g.fillStyle = halo; g.fillRect(0, 0, W, H);
    g.beginPath(); g.arc(sx, sy, sr, 0, 6.283);
    g.fillStyle = "rgba(255,246,214,.95)"; g.fill();

    /* clouds */
    drawClouds();

    /* hills in mist (3 layers) */
    hill(H * 0.62, 40, "rgba(120,100,130,.35)", 0.8);
    hill(H * 0.7, 30, "rgba(140,110,120,.4)", 1.3);
    hill(H * 0.78, 22, "rgba(150,120,115,.5)", 1.9);

    /* lake */
    const lakeY = H * 0.82;
    const lake = g.createLinearGradient(0, lakeY, 0, H);
    lake.addColorStop(0, cols[1]);
    lake.addColorStop(1, cols[0]);
    g.fillStyle = lake;
    g.fillRect(0, lakeY, W, H - lakeY);
    /* sun reflection */
    g.fillStyle = "rgba(255,236,190,.3)";
    for (let i = 0; i < 8; i++) {
      const ry = lakeY + 6 + i * ((H - lakeY) / 9);
      const rw = 60 - i * 5;
      g.fillRect(sx - rw / 2 + Math.sin(t / 800 + i) * 8, ry, rw, 2.5);
    }

    /* balloons (back to front by size) */
    balloons.forEach(b => {
      stepBalloon(b, drift, now);
      drawBalloon(b, lakeY);
    });

    /* field + chase vehicles at the bottom */
    drawField(lakeY);
  }
  requestAnimationFrame(loop);

  function hill(baseY, amp, color, freq) {
    g.fillStyle = color;
    g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 16) {
      const y = baseY + Math.sin(x * 0.003 * freq + freq * 9) * amp;
      g.lineTo(x, y);
    }
    g.lineTo(W, H); g.fill();
  }

  const clouds = [];
  for (let i = 0; i < 5; i++) clouds.push({ x: Math.random(), y: 0.1 + Math.random() * 0.25, s: 0.5 + Math.random() });
  function drawClouds() {
    clouds.forEach(cl => {
      cl.x += 0.00004 * (wind + gust) * 4;
      if (cl.x > 1.2) cl.x = -0.3;
      const cx = cl.x * W, cy = cl.y * H;
      g.fillStyle = "rgba(255,246,240," + (0.18 + sun * 0.3) + ")";
      [[0, 0, 46], [40, 6, 34], [-38, 8, 30], [16, -12, 30]].forEach(([dx, dy, r]) => {
        g.beginPath();
        g.ellipse(cx + dx * cl.s, cy + dy * cl.s, r * cl.s, r * 0.45 * cl.s, 0, 0, 6.283);
        g.fill();
      });
    });
  }

  function stepBalloon(b, drift, now) {
    if (b.grounded) {
      b.alt += (0 - b.alt) * 0.02;
      /* occasional inflation */
      if (Math.random() < 0.002) { b.grounded = false; b.burner = 1; }
    } else {
      b.alt += (b.targetAlt - b.alt) * 0.004 + b.burner * 0.0012;
      b.burner *= 0.97;
      b.x += drift + Math.sin(now / 3000 + b.sway) * 0.00006;
      if (b.x > 1.15) b.x = -0.15;
      if (b.x < -0.15) b.x = 1.15;
    }
  }

  function drawBalloon(b, lakeY) {
    const scale = 0.7 + b.alt * 0.6;
    const s = b.size * scale;
    const bx = b.x * W;
    const by = lakeY - b.alt * H * 0.62 - s * 0.8;
    const sway = Math.sin(t / 1700 + b.sway) * 3;

    /* reflection */
    if (!b.grounded) {
      g.save();
      g.globalAlpha = 0.25;
      g.translate(bx, lakeY + (lakeY - by) * 0.35);
      g.scale(1, -0.4);
      envelope(bx, by, s, sway, b);
      g.restore();
    }

    /* balloon */
    g.save();
    g.translate(sway, 0);
    envelope(bx, by, s, sway, b);
    /* basket + ropes */
    if (!b.grounded || b.alt > 0.02) {
      g.strokeStyle = "rgba(90,70,60,.7)"; g.lineWidth = 1.2;
      g.beginPath();
      g.moveTo(bx - s * 0.3, by + s * 0.62); g.lineTo(bx - s * 0.18, by + s * 1.02);
      g.moveTo(bx + s * 0.3, by + s * 0.62); g.lineTo(bx + s * 0.18, by + s * 1.02);
      g.stroke();
      g.fillStyle = "#7a5a3a";
      g.fillRect(bx - s * 0.2, by + s * 1.02, s * 0.4, s * 0.26);
    }
    /* burner flame */
    if (b.burner > 0.15) {
      g.fillStyle = "rgba(255," + (150 + Math.random() * 80) + ",60," + b.burner + ")";
      g.beginPath();
      g.ellipse(bx, by + s * 0.98, s * 0.1, s * 0.22 * (0.7 + Math.random() * 0.5), 0, 0, 6.283);
      g.fill();
    }
    g.restore();
  }

  function envelope(bx, by, s, sway, b) {
    const [c1, c2, c3] = b.hue;
    /* envelope shape */
    g.beginPath();
    g.moveTo(bx, by - s * 0.9);
    g.bezierCurveTo(bx + s * 0.85, by - s * 0.8, bx + s * 0.75, by + s * 0.5, bx, by + s * 0.66);
    g.bezierCurveTo(bx - s * 0.75, by + s * 0.5, bx - s * 0.85, by - s * 0.8, bx, by - s * 0.9);
    g.closePath();
    g.fillStyle = c1;
    g.fill();
    g.save();
    g.clip();
    if (b.pat === "stripes") {
      g.fillStyle = c2;
      for (let i = -3; i <= 3; i++) {
        g.save(); g.translate(bx, by); g.rotate(i * 0.4);
        g.fillRect(-s, -s * 1.4, s * 0.22, s * 2.8);
        g.restore();
      }
    } else if (b.pat === "dots") {
      g.fillStyle = c2;
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * 6.283;
        g.beginPath();
        g.arc(bx + Math.cos(a) * s * 0.4, by + Math.sin(a) * s * 0.5, s * 0.1, 0, 6.283);
        g.fill();
      }
    } else if (b.pat === "chevron") {
      g.strokeStyle = c2; g.lineWidth = s * 0.12;
      for (let i = 0; i < 4; i++) {
        g.beginPath();
        g.moveTo(bx - s, by - s * 0.5 + i * s * 0.3);
        g.lineTo(bx, by - s * 0.2 + i * s * 0.3);
        g.lineTo(bx + s, by - s * 0.5 + i * s * 0.3);
        g.stroke();
      }
    } else {
      g.fillStyle = c2;
      g.fillRect(bx - s * 0.35, by - s, s * 0.35, s * 2);
      g.fillStyle = c3;
      g.fillRect(bx + s * 0.35, by - s, s * 0.35, s * 2);
    }
    /* shading */
    const sh = g.createLinearGradient(bx - s, by, bx + s, by);
    sh.addColorStop(0, "rgba(255,255,255,.22)");
    sh.addColorStop(0.5, "rgba(255,255,255,0)");
    sh.addColorStop(1, "rgba(40,20,30,.32)");
    g.fillStyle = sh;
    g.fillRect(bx - s, by - s, s * 2, s * 2);
    g.restore();
  }

  /* chase vehicles on the road */
  const cars = [{ x: 0.2, v: 0.00008 }, { x: 0.7, v: 0.00005 }];
  function drawField(lakeY) {
    /* launch field */
    g.fillStyle = "rgba(110,100,90,.5)";
    g.beginPath();
    g.ellipse(W * 0.22, H * 0.87, W * 0.16, H * 0.05, 0, 0, 6.283);
    g.fill();
    /* road */
    g.strokeStyle = "rgba(90,85,80,.7)"; g.lineWidth = 3;
    g.setLineDash([10, 12]);
    g.beginPath();
    g.moveTo(0, H * 0.93);
    for (let x = 0; x <= W; x += 30) g.lineTo(x, H * 0.93 + Math.sin(x * 0.01) * 4);
    g.stroke();
    g.setLineDash([]);
    cars.forEach(car => {
      car.x += car.v * (0.5 + wind);
      if (car.x > 1.05) car.x = -0.05;
      const cx = car.x * W, cy = H * 0.93 + Math.sin(cx * 0.01) * 4;
      g.fillStyle = "#5a6a7a";
      g.fillRect(cx - 7, cy - 6, 14, 5);
      g.fillStyle = "#3a4a5a";
      g.fillRect(cx - 4, cy - 9, 7, 4);
    });
  }

  /* ---------- controls ---------- */
  $("sunR").addEventListener("input", (e) => {
    sun = parseInt(e.target.value, 10) / 100;
    $("statusL").textContent = sun < 0.25 ? "night launch" : sun < 0.5 ? "first light" : sun < 0.75 ? "golden hour" : "full morning";
  });
  $("burnBtn").addEventListener("click", () => {
    balloons.forEach(b => { if (!b.grounded) { b.burner = 1; b.targetAlt = Math.min(0.85, b.targetAlt + 0.06); } });
    whoosh();
  });
  $("regattaBtn").addEventListener("click", function () {
    const on = this.classList.toggle("on");
    balloons.forEach(b => {
      b.grounded = !on;
      if (on) { b.burner = 1; b.targetAlt = 0.2 + Math.random() * 0.5; }
    });
    whoosh();
  });
  $("gustBtn").addEventListener("click", () => { gust = 2.2; });

  /* drag balloons vertically */
  let dragB = null;
  cv.addEventListener("pointerdown", (e) => {
    balloons.forEach(b => {
      const bx = b.x * W, by = H * 0.82 - b.alt * H * 0.62 - b.size * 0.8;
      if (Math.hypot(e.clientX - bx, e.clientY - by) < b.size * 1.4) dragB = b;
    });
  });
  cv.addEventListener("pointermove", (e) => {
    if (!dragB) return;
    const alt = Math.max(0, Math.min(0.9, (H * 0.82 - e.clientY) / (H * 0.62)));
    dragB.alt = alt;
    dragB.targetAlt = alt;
    dragB.grounded = alt < 0.02;
  });
  addEventListener("pointerup", () => { dragB = null; });
})();
</script>
</body>
</html>
